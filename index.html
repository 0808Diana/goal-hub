<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7fae8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="成长工作台">
<title>成长工作台 · 慢慢来，也一直在向前</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#faf8f3; --bg2:#f1ede4; --card:#ffffff;
  --ink:#2c2e26; --ink2:#4a4d42; --muted:#8a8b80; --muted2:#aaa99c;
  --line:#ece7da; --line2:#e0d9c8;
  --pp:#6f9e7e; --pp2:#94bd9f; --pp3:#bcc99a; --pp-soft:#eef4ec; --pp-line:#cfe3d6;
  --gr:#5a9e72; --gr-soft:#e8f3ec; --gr-line:#bfe3cd;
  --rd:#d2695f; --rd-soft:#fbecea; --rd-line:#f3ccc6;
  --am:#c08a3e; --am-soft:#faf2e2; --am-line:#ecd9b6;
  --grad:linear-gradient(135deg,#7fae8a 0%,#9cc2a6 58%,#cbb487 100%);
  --sh:0 1px 2px rgba(40,38,28,.05),0 10px 28px rgba(40,38,28,.05);
  --sh2:0 2px 6px rgba(40,38,28,.06),0 18px 48px rgba(40,38,28,.10);
  --r:16px; --r2:12px;
  --sage:#6f9e7e; --sage-soft:#eef4ec;
  --sand:#c08a3e; --sand-soft:#faf2e2;
  --sky:#6f9bcf; --sky-soft:#eaf1f8;
  --blush:#cf8f86; --blush-soft:#fbeeeb;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 420px at 82% -12%,#eef3e9 0%,rgba(238,243,233,0) 60%),radial-gradient(900px 380px at -8% 0%,#f5eee2 0%,rgba(245,238,226,0) 58%);
  background-attachment:fixed;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none}
.ic{display:block;flex:0 0 auto}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--pp)}

/* ============ 布局骨架（手机优先） ============ */
.app{min-height:100vh}
main{padding:14px 14px calc(88px + env(safe-area-inset-bottom)) 14px;max-width:1360px;margin:0 auto}
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:stretch;
}
.brand,.navfoot{display:none}
.navlist{display:flex;width:100%}
.navbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:56px;padding:6px 2px;font-size:11px;color:var(--muted);font-weight:600;border-radius:10px;
}
.navbtn .ic{width:21px;height:21px}
.navbtn.on{color:var(--pp)}
@media (min-width:768px){
  main{padding:18px 22px 40px}
  .nav{
    position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);
    padding:10px 18px;align-items:center;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .brand .lg{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.34)}
  .brand b{font-size:15px}
  .navlist{justify-content:flex-end;gap:6px}
  .navbtn{flex:0 0 auto;flex-direction:row;gap:7px;min-height:42px;padding:8px 14px;font-size:14px;border-radius:11px}
  .navbtn.on{background:var(--pp-soft)}
}
@media (min-width:1024px){
  .nav{
    position:fixed;top:0;left:0;bottom:0;right:auto;width:236px;
    flex-direction:column;align-items:stretch;gap:0;padding:20px 14px 16px;
    border-bottom:0;border-right:1px solid var(--line);background:rgba(255,255,255,.82);
  }
  .brand{margin:0 6px 20px}
  .brand .lg{width:36px;height:36px;border-radius:11px}
  .brand b{font-size:16px}
  .navlist{flex-direction:column;width:100%;gap:4px}
  .navbtn{width:100%;justify-content:flex-start;padding:11px 13px;font-size:14.5px}
  .navfoot{display:block;margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted2);line-height:1.55}
  main{margin-left:236px;padding:26px 30px 60px;max-width:1240px}
}

/* ============ 左下角「我的」账号入口（参考 WorkBuddy 左下角账号区设计） ============ */
.me-fab{
  position:fixed; z-index:70; left:14px; bottom:calc(70px + env(safe-area-inset-bottom));
  display:inline-flex; align-items:center; gap:9px; text-align:left;
  padding:7px 11px 7px 7px; border:1px solid var(--line); border-radius:15px;
  background:rgba(255,255,255,.93); backdrop-filter:saturate(1.5) blur(12px);
  box-shadow:0 8px 22px rgba(40,38,28,.13);
  cursor:pointer; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.me-fab .mf-av{ flex:0 0 auto; width:30px; height:30px; border-radius:10px; background:var(--grad); color:#fff; display:grid; place-items:center; box-shadow:0 4px 12px rgba(124,92,255,.30) }
.me-fab .mf-av svg{ width:16px; height:16px }
.me-fab .mf-tx{ display:flex; flex-direction:column; gap:1px; line-height:1.25 }
.me-fab .mf-n{ font-size:13.5px; font-weight:700; color:var(--ink) }
.me-fab .mf-s{ font-size:10.5px; font-weight:600; color:var(--muted2) }
.me-fab .mf-ch{ flex:0 0 auto; color:var(--muted2); display:grid; place-items:center }
.me-fab:hover{ box-shadow:0 12px 26px rgba(40,38,28,.17); border-color:var(--line2) }
.me-fab:active{ transform:scale(.97) }
.me-fab.on{ border-color:var(--pp); background:#fff }
.me-fab.on .mf-n{ color:var(--pp) }
@media (max-width:520px){ .me-fab .mf-s{ display:none } }
@media (min-width:768px){ .me-fab{ left:16px; bottom:16px } }
@media (min-width:1024px){ .me-fab{ left:18px; bottom:18px } }

/* 导航项：长短标签 + 未回顾小红点 */
.navbtn{ position:relative }
.nb-l{ display:none }
.nb-dot{ display:none; width:8px; height:8px; border-radius:50%; background:#ff5d5d }
.nb-dot.show{ display:block; position:absolute; top:7px; left:calc(50% + 9px) }
@media (min-width:768px){
  .nb-s{ display:none }
  .nb-l{ display:inline }
  .nb-dot.show{ position:static; margin-left:1px }
}

/* 复盘中心：每日 / 周 分段切换 */
/* 复盘页：周包含日 */
.rc-month-picker{ width:auto!important; font-size:13px; padding:5px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg2); color:var(--ink) }
.rwd-row{ display:flex; align-items:center; gap:10px; padding:9px 8px; border-bottom:1px solid var(--line2); cursor:pointer; transition:background .12s; border-radius:8px; margin:2px 0 }
.rwd-row:hover{ background:var(--bg2) }
.rwd-row.done{ opacity:.75 }
.rwd-row.today{ background:rgba(124,92,255,.05); border-left:3px solid var(--pp) }
.rwd-row .rwd-left{ display:flex;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer }
.rwd-row .rwd-dot{ width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;background:var(--gr);color:#fff;flex-shrink:0 }
.rwd-row:not(.done) .rwd-dot{ background:var(--bg2);border:1.5px solid var(--line2) }
.rwd-row .rwd-date{ font-size:13px;font-weight:700;color:var(--ink) }
.rwd-row .rwd-wd{ font-size:11px;color:var(--muted) }
.rwd-row .rwd-stat{ flex:1 1 auto;font-size:12px;display:flex;align-items:center;gap:6px;min-width:0 }
.rwd-row .rwd-actions{ flex:0 0 auto;display:flex;gap:4px }
.rwd-detail{ padding:10px 8px 14px 28px;border-top:1px dashed var(--line2);margin:0 0 4px 0 }.rv-foot-row{ margin-top:12px; text-align:right; }
.rv-foot-row .btn{ display:inline-flex; align-items:center; gap:6px; }

/* ============ 通用组件 ============ */
.tabpane{display:none}
.tabpane.on{display:block;animation:panein .22s ease}
#pane-map.on{display:flex;flex-direction:column;height:calc(100vh - 120px);overflow:hidden}
@keyframes panein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 16px;flex-wrap:wrap}
.pagehead h1{font-size:22px}
.pagehead .sub{color:var(--muted);font-size:13px;margin-top:3px}
.pagehead .ph-back{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.pagehead .ph-back > div{min-width:0}
/* 今日页入口卡片 */
.entry-cards{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.entry-card{flex:1;min-width:140px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--card);box-shadow:var(--sh);cursor:pointer;transition:.14s;text-align:left;color:var(--ink2)}
.entry-card:hover{border-color:var(--pp-line);background:var(--pp-soft);transform:translateY(-1px);box-shadow:var(--sh2)}
.entry-card svg{color:var(--pp)}
.entry-card span{font-size:15px;font-weight:700}
.entry-card small{font-size:11.5px;color:var(--muted);line-height:1.4}
@media (max-width:480px){
  .entry-cards{gap:8px}
  .entry-card{min-width:0;flex:1 1 calc(33% - 6px);padding:11px 12px}
  .entry-card span{font-size:13px}
  .entry-card small{font-size:10.5px}
}
@media(min-width:1024px){.pagehead h1{font-size:26px}}

.sec{margin:20px 0 0}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.02em;margin:0 2px 10px}
.sec-title .cnt{font-weight:600;color:var(--muted2);font-size:12px}
.sec-title .line{flex:1;height:1px;background:var(--line2)}

.grid{display:grid;gap:13px;grid-template-columns:1fr}
@media (min-width:768px){.grid{gap:15px;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1024px){.grid{gap:16px}}
@media (min-width:1400px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:15px;position:relative;overflow:hidden}
.card.pad0{padding:0}
.wide{grid-column:1/-1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;font-size:14.5px;font-weight:650;background:#fff;border:1px solid var(--line2);color:var(--ink2);transition:.14s}
.btn:hover{border-color:#c9cfe6}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);color:#fff;border:0;box-shadow:0 8px 20px rgba(124,92,255,.28)}
.btn.pri:hover{filter:brightness(1.04)}
.btn.ok{background:var(--gr);color:#fff;border:0;box-shadow:0 8px 18px rgba(15,174,127,.24)}
.btn.dan{background:var(--rd);color:#fff;border:0}
.btn.ghost{background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.xs{min-height:32px;padding:0 9px;font-size:12.5px;border-radius:9px}
.btn.wfull{width:100%}
.iconbtn{width:36px;height:36px;min-height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--bg2);color:var(--ink2)}
@media(max-width:767px){.iconbtn{width:44px;height:44px}}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--bg2);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.pp{background:var(--pp-soft);color:#5a3fd6;border-color:var(--pp-line)}
.chip.gr{background:var(--gr-soft);color:#087a59;border-color:var(--gr-line)}
.chip.rd{background:var(--rd-soft);color:#b62239;border-color:var(--rd-line)}
.chip.am{background:var(--am-soft);color:#9a6100;border-color:var(--am-line)}

.muted{color:var(--muted)}
.tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* 表单 */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--muted2);font-weight:500;margin-left:6px}
.inp,textarea.inp,select.inp{
  width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line2);border-radius:12px;background:#fbfcff;
  font-size:16px;outline:none;transition:.14s;appearance:none;-webkit-appearance:none;
}
select.inp{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23767c96' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}
textarea.inp{min-height:70px;resize:vertical;line-height:1.55}
.inp:focus{border-color:var(--pp);background:#fff;box-shadow:0 0 0 3px rgba(124,92,255,.13)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:11px;border:2px solid transparent;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 3px #fff inset}

/* 备份横幅 */
.banner{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;background:linear-gradient(120deg,#fff8e6,#fffdf7);border:1px solid var(--am-line);margin-bottom:15px;box-shadow:0 6px 18px rgba(221,140,0,.08)}
.banner .bi{width:34px;height:34px;border-radius:10px;background:var(--am-soft);color:var(--am);display:grid;place-items:center;flex:0 0 auto}
.banner .bt{flex:1;min-width:0;font-size:13.2px;line-height:1.5}
.banner .bt b{color:#8a5a00}
.banner .ba{display:flex;gap:7px;flex:0 0 auto;flex-wrap:wrap}
@media(max-width:520px){.banner{flex-wrap:wrap}.banner .ba{width:100%}.banner .ba .btn{flex:1}}

/* 今日要处理 */
.alert{border-radius:var(--r);padding:14px;border:1px solid;position:relative;overflow:hidden}
.alert .ah{display:flex;align-items:center;gap:8px;font-weight:750;font-size:14.5px;margin-bottom:6px}
.alert .am2{font-size:13.2px;line-height:1.58}
.alert .aa{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.alert.red{background:var(--rd-soft);border-color:var(--rd-line);color:#8f1b30}
.alert.red .ah{color:#c02440}
.alert.amber{background:var(--am-soft);border-color:var(--am-line);color:#7a5100}
.alert.amber .ah{color:#a86b00}
.alert.purple{background:var(--pp-soft);border-color:var(--pp-line);color:#4b34ba}
.alert.purple .ah{color:#5a3fd6}
.alert.green{background:var(--gr-soft);border-color:var(--gr-line);color:#0a6a4d}
.alert.green .ah{color:#0b8963}
.plan-in-alert{margin-top:9px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.66);border:1px dashed currentColor;font-size:12.4px;line-height:1.55;opacity:.95}

/* ============ 提醒区：此刻聚焦卡 + 概览栏（替代原堆叠卡） ============ */
.alert-focus{position:relative}
.alert-focus .af-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--pp);background:var(--pp-soft);border:1px solid var(--pp-line);border-radius:999px;padding:3px 10px;margin-bottom:9px}
.alert-grid{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}
.alert-main{min-width:0}
.alert-side{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.alert-overview{display:flex;flex-wrap:wrap;gap:6px}
.alert-overview .chip{cursor:pointer;font-size:11px}
.alert-sheet-list{display:flex;flex-direction:column;gap:12px}
/* 打卡后聚焦卡短暂高亮，让「已更新」可见 */
.alert-main.just-punched{animation:afPulse .7s ease-out}
@keyframes afPulse{
  0%{box-shadow:0 0 0 0 var(--pp);background:var(--pp-soft);border-radius:14px}
  60%{box-shadow:0 0 0 6px rgba(124,92,255,0)}
  100%{box-shadow:0 0 0 0 rgba(124,92,255,0);background:transparent}
}
@media(min-width:768px){
  .alert-grid{grid-template-columns:1fr 240px}
  .alert-side{position:sticky;top:12px}
}

/* 目标卡 */
.gcard{padding:0}
.gcard .bar{height:4px;width:100%}
.gcard .body{padding:12px 14px 14px}
.ghead{display:flex;align-items:center;gap:10px}
.ghead .gt{flex:1;min-width:0}
.ghead h3{font-size:15px;line-height:1.35;word-break:keep-all;overflow-wrap:normal}
.ghead .gmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.gacts{display:flex;gap:2px;flex:0 0 auto}
.pbar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:10px 0 6px}
.pbar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px}
.stat3-inline{display:flex;gap:6px;flex:0 0 auto}
.stat3-inline .si{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px;text-align:center;min-width:52px}
.stat3-inline .si .k{font-size:9.5px;color:var(--muted2);font-weight:600;margin-bottom:1px;white-space:nowrap}
.stat3-inline .si .v{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat3-inline .si .v small{font-size:9.5px;font-weight:600;color:var(--muted)}
.planbox{margin-top:12px;border-radius:12px;border:1px dashed var(--line2);background:#fcfcff;padding:10px 11px;font-size:12.6px;line-height:1.6}
.planbox .pk{display:flex;gap:7px;align-items:flex-start}
.planbox .pk+.pk{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.planbox .pk b{flex:0 0 auto;color:var(--ink2);font-weight:700}
.planbox .pk span{color:var(--ink2);min-width:0;word-break:break-word}

/* 打卡区 */
.punch{margin-top:13px;border-top:1px dashed var(--line2);padding-top:12px}
.punch .prow{display:grid;grid-template-columns:1.15fr .85fr;gap:8px}
.punch .prow2{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.punch .lbl{font-size:11px;color:var(--muted2);font-weight:650;margin:0 0 4px 2px}
.punch .inp{min-height:44px;padding:9px 11px;border-radius:11px}
.suggest-tip{display:flex;align-items:center;gap:6px;font-size:12.3px;color:#5a3fd6;background:var(--pp-soft);border:1px solid var(--pp-line);border-radius:10px;padding:7px 10px;margin-bottom:10px}
.suggest-tip.ok{color:var(--gr);background:var(--gr-soft);border-color:var(--gr-line)}
.flash{animation:flash 1.5s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}60%{box-shadow:0 0 0 10px rgba(124,92,255,0)}100%{box-shadow:0 0 0 0 rgba(124,92,255,0)}}

/* ============ 移动端目标卡适配 ============ */
@media (max-width:600px){
  .gcard .body{padding:11px 12px 13px}
  .ghead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 6px}
  .ghead .gt{flex:1 1 calc(100% - 68px);min-width:0;order:1}
  .ghead h3{font-size:14.5px;word-break:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .ghead .gmeta{gap:4px;margin-top:2px}
  .ghead .gmeta .chip{font-size:10.5px;padding:2px 7px}
  .gacts{flex:0 0 auto;display:flex;gap:1px;order:2;align-self:flex-start}
  .gacts .iconbtn{width:30px;height:30px;min-height:30px}
  .gacts .iconbtn svg{width:14px;height:14px}

  .pbar{margin:8px 0 5px}
  .ringwrap{flex-wrap:wrap;gap:10px}

  main{padding-bottom:calc(100px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}

}

/* 新建入口 */
.newbig{width:100%;min-height:76px;border-radius:var(--r);border:2px dashed var(--pp-line);background:linear-gradient(180deg,#faf8ff,#f6f3ff);color:#5a3fd6;font-weight:750;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;transition:.16s}
.newbig:hover{border-color:var(--pp);background:#f4f0ff}

/* 看板 */
.ringwrap{display:flex;gap:14px;align-items:center}
.reclist{margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}
.rec{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid #f2f4fb;font-size:13px}
.rec:last-child{border-bottom:0}
.rec .rd{width:52px;flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.3px}
.rec .rv{font-weight:700;font-variant-numeric:tabular-nums}
.rec .rm{color:var(--muted);font-size:12.3px}
.rec .rd .rt{display:block;font-size:10.5px;color:var(--muted2);font-weight:400;letter-spacing:.01em;margin-top:1px}
.rec .sp{flex:1}
.badge-bu{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--am-soft);color:var(--am);border:1px solid var(--am-line);font-size:10.5px;font-weight:800;line-height:1}
.chartbox{overflow-x:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.3px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 周报 */
.weekbar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.weekbar .wt{font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:13.4px}
.tbl th,.tbl td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th{font-size:11.5px;color:var(--muted2);font-weight:700;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line2);background:#fbfcff}
.delta{font-size:11.5px;font-weight:700;display:block;margin-top:1px}
.delta.up{color:var(--gr)}.delta.dn{color:var(--rd)}.delta.eq{color:var(--muted2)}
@media(max-width:600px){
  .tbl thead{display:none}
  .tbl tr{display:block;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:9px;background:#fff}
  .tbl td{display:flex;justify-content:space-between;align-items:baseline;border:0;padding:4px 0;text-align:right}
  .tbl td:first-child{font-weight:750;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:4px}
  .tbl td::before{content:attr(data-l);font-size:11.5px;color:var(--muted2);font-weight:650}
  .tbl td:first-child::before{content:none}
  .tbl tfoot tr{background:#fbfcff}
}
.four{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:768px){.four{grid-template-columns:1fr 1fr}}
.fbox label{display:flex;align-items:center;gap:6px}

/* 我的 */
.melist .mi{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.melist .mi:last-child{border-bottom:0}
.melist .mi .mic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.melist .mi .mt{flex:1;min-width:0}
.melist .mi .mt b{display:block;font-size:14.5px}
.melist .mi .mt span{font-size:12.3px;color:var(--muted);line-height:1.5;display:block;margin-top:2px}
@media(max-width:560px){.melist .mi{flex-wrap:wrap}.melist .mi .btn{width:100%}}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 0 34px;margin-bottom:12px;font-size:13.4px;line-height:1.6}
.steps li:last-child{margin-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:23px;height:23px;border-radius:8px;background:var(--grad);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}

/* 模态 */
.modal-root{position:fixed;inset:0;z-index:200;display:none}
.modal-root.on{display:block}
.mask{position:absolute;inset:0;background:rgba(20,22,38,.42);backdrop-filter:blur(3px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 28px));max-height:min(86vh,760px);overflow:auto;
  background:#fff;border-radius:20px;box-shadow:var(--sh2);animation:pop .2s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(max-width:600px){
  .sheet{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:92vh;border-radius:20px 20px 0 0;animation:up .22s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;border-radius:20px 20px 0 0}
.sheet .sh h3{flex:1;font-size:17px}
.sheet .sb{padding:16px 18px}
.sheet .sf{padding:12px 18px calc(16px + env(safe-area-inset-bottom));display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.sheet .sf .btn{flex:1}
@media(min-width:601px){.sheet .sf .btn{flex:0 0 auto;min-width:100px}}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media(min-width:768px){#toast{bottom:28px}}
.tm{background:rgba(24,26,43,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--sh2);animation:tin .2s ease;max-width:82vw}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

#fx{position:fixed;inset:0;pointer-events:none;z-index:400;display:none}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .ei{width:52px;height:52px;border-radius:16px;background:var(--pp-soft);color:var(--pp);display:grid;place-items:center;margin:0 auto 12px}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.empty p{margin:0;font-size:13px;line-height:1.6}
.danger-zone{border-color:var(--rd-line);background:linear-gradient(180deg,#fffafb,#fff)}

/* 情报阅读渠道清单 */
.intel-ch{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #f2f4fb}
.intel-ch:last-child{border-bottom:0}
.intel-ch .icn{width:22px;height:22px;flex:0 0 auto;color:var(--muted)}
.intel-ch .cn{flex:1;min-width:0}
.intel-ch .cn b{display:block;font-size:13.6px;line-height:1.35;word-break:break-word}
.intel-ch .cn .cat{font-size:11px;color:var(--muted2);margin-top:1px}
.intel-ch .cn .reason{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;word-break:break-word}
.intel-ch.done .cn b{color:var(--ink2)}
.intel-ch.nodate{opacity:.62}
.intel-ch.nodate{background:#fbfbfd}
.intel-ch.done{opacity:.62}

.intel-check{width:40px;height:40px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;border:1.5px solid var(--line2);color:var(--muted);background:#fff;transition:.14s}

@media(max-width:560px){.intel-ch{gap:7px}.intel-ch .dt{width:108px}.intel-ch .heat{width:44px}.intel-ch .dt input{font-size:12px}.intel-ch .cn b{font-size:13px}}

.fruit-season{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* 打卡日历视图 */
.cal-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-weight:600;font-size:15px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}

.cal-cell{min-height:56px;border:1px solid var(--line2);border-radius:10px;padding:5px 6px;background:#fff;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:3px}

.cal-num{font-size:12px;font-weight:600;color:var(--ink)}

/* 内容/备注 */

/* 周明细 */
.wkdetail{margin-top:6px}

.tgl{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px}
.tgl button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--muted)}
.tgl button.on{background:#fff;color:var(--pp);box-shadow:0 1px 3px rgba(24,26,43,.1)}

/* ============ 成长地图 / 时间节奏（日系清新 · 自然色） ============ */
.map-hero{text-align:left;margin:2px 0 18px}
.map-hero h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.map-hero .sub{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.6}
.map-hero .leaf{color:var(--sage)}

.dir-grid{display:grid;gap:13px;grid-template-columns:1fr}

.dir-card{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;position:relative;overflow:hidden;transition:.16s;cursor:pointer}
.dir-card:hover{box-shadow:var(--sh2);transform:translateY(-1px)}

.dir-card .dmeta .chip{font-size:11.5px}
.dir-card .dmore{color:var(--muted2);align-self:center}

.backbar{display:flex;align-items:center;gap:9px;margin:2px 0 16px}
.backbar button{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13.5px;font-weight:600;min-height:40px;padding:0 10px;border-radius:10px}
.backbar button:hover{background:var(--bg2);color:var(--ink2)}
.backbar .bt{font-size:17px;font-weight:750;margin-left:2px}

.node-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;position:relative;overflow:hidden;transition:.16s}

.node-card .nbar{position:absolute;left:0;top:0;bottom:0;width:4px}
.node-card h3{font-size:16px;font-weight:750}
.node-card .ndesc{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.6}
.node-card .nmeta{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;align-items:center}
.stpill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:650}
.stpill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.st-0{color:#8a8b80;background:#f1ede4}.st-1{color:#5a9e72;background:#e8f3ec}.st-2{color:#c08a3e;background:#faf2e2}.st-3{color:#6f9bcf;background:#eaf1f8}

.ndetail .sec2{margin:18px 0 0}

.ndetail .goal-row .gt .gs{color:var(--muted);font-size:12px;margin-top:2px}
.ndetail .rec-mini{display:flex;align-items:baseline;gap:9px;padding:6px 2px;border-bottom:1px solid #f3efe6}
.ndetail .rec-mini:last-child{border-bottom:0}
.ndetail .rec-mini .rd{color:var(--ink2);font-size:12.5px;font-weight:600;flex:0 0 auto}
.ndetail .rec-mini .rt{color:var(--muted2);font-size:11px}
.ndetail .rec-mini .rv{color:var(--sage);font-weight:650;font-size:13px}
.ndetail .rec-mini .rm{color:var(--muted);font-size:11.5px}
@media (max-width:600px){

  .ndetail .goal-row .gt b{font-size:13.5px}
  .ndetail .goal-row .gt .gs{font-size:11.5px}

.ws-btn{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:650;transition:.14s;min-height:52px;justify-content:center}
.ws-btn .emo{font-size:18px;line-height:1}
.ws-btn.on{color:var(--ink);border-color:var(--pp-line);background:var(--pp-soft);box-shadow:var(--sh)}
.ws-btn.on small{color:var(--pp)}

.rt-main{flex:1;min-width:0}

.rt-task{margin-top:5px}

.empty-soft{text-align:center;padding:38px 18px;color:var(--muted)}

.empty-soft b{color:var(--ink2);font-size:15px}
.empty-soft p{font-size:13px;line-height:1.7;margin:8px auto 0;max-width:340px}
.empty-soft .btn{margin-top:14px}
.fitbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.fit{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line2);border-radius:10px;font-size:13px;color:var(--ink2);cursor:pointer;background:#fff;min-height:40px}
.fit input{width:16px;height:16px;accent-color:var(--pp);margin:0}

/* ============ 成长地图通用元素（旧版兼容） ============ */
.mapcat{position:absolute;right:10px;bottom:8px;width:46px;height:46px;opacity:.7;pointer-events:none;z-index:2}
/* 关联任务面板 */
.linklist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin:2px 0}
.lk .lks{font-size:10px;color:var(--muted);background:var(--bg2);border-radius:5px;padding:0 4px;margin-left:4px}
.node-goals-toggle{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--pp);cursor:pointer;user-select:none;background:var(--bg-soft)}
.node-goals-toggle:hover{background:var(--pp-soft)}
.lk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line2);border-radius:12px;background:#fff;cursor:pointer;font-size:13.5px}
.lk:hover{border-color:var(--pp-line);background:var(--pp-soft)}
.lk .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.lk .lkt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .lks{font-size:10.5px;color:var(--muted);background:var(--bg2);padding:1px 7px;border-radius:999px}
.lk input{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.lk .lkbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;color:transparent;flex:0 0 auto;transition:.12s}
.lk.on{border-color:var(--pp);background:var(--pp-soft)}
.lk.on .lkbox{background:var(--pp);border-color:var(--pp);color:#fff}
.lk.on .lkt{font-weight:650}
.node-tag small{font-size:10px;opacity:.85;margin-left:2px}
.map-tip{position:absolute;z-index:30;display:none;max-width:262px;pointer-events:none;background:var(--card);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh2);padding:11px 13px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.map-tip h4{font-size:13.5px;margin-bottom:4px}
.tt-row{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0}
.tt-row .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.muted{color:var(--muted)}

/* ============ 今日三件事 + 每日复盘 ============ */
.mitlist{display:flex;flex-direction:column;gap:8px}
.mit-row{display:flex;align-items:center;gap:8px}
.mitchk{width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;background:var(--card);transition:.15s;cursor:pointer}
.mitchk.on{background:var(--pp);border-color:var(--pp);color:#fff}
.mit-inp{flex:1}
.mit-row.done .mit-inp{text-decoration:line-through;color:var(--muted)}
.mitclear{width:26px;height:26px;min-width:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted);opacity:.45;transition:.15s;cursor:pointer}
.mitclear:hover{opacity:1}
.daily-ta{width:100%;min-height:64px;resize:vertical;font-size:14px}

/* ============ 我的目标：紧凑清单（打卡产品式，点行展开详情） ============ */
.glist{display:flex;flex-direction:column;gap:8px}
.grow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--sh);cursor:pointer;transition:border-color .14s,box-shadow .14s}
.grow:hover{border-color:var(--line2)}
.grow.done .gname{color:var(--muted);text-decoration:line-through}
.grow.done .gstat{color:var(--muted)}
.gdot{width:12px;height:12px;min-width:12px;border-radius:50%}
.gmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gname{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gstat{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar{width:88px;min-width:88px;height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99px}
.gquick{width:38px;height:38px;min-width:38px;border-radius:11px;background:var(--pp-soft);color:var(--pp);display:grid;place-items:center;border:1px solid var(--pp-line);transition:.14s}
.gquick:active{transform:scale(.92)}
.gchev{width:22px;min-width:22px;color:var(--muted);display:grid;place-items:center;transition:transform .18s}
.grow.open .gchev{transform:rotate(180deg)}
@media(max-width:600px){ .gbar{display:none} }
/* 书单视图：书籍卡片（替代被误用的圆形按钮 .gquick 38×38 约束） */
.book-item{display:flex;gap:10px;align-items:center;padding:12px 13px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .12s}
.book-item:hover{border-color:var(--line2);box-shadow:var(--sh2)}
.book-item:active{transform:scale(.99)}
.book-item .btitle{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-item .bmeta{flex:1;min-width:0}
.book-item .bauthor{margin-top:2px}
.book-item .bprogress{margin-top:5px;color:var(--muted)}
.book-item .bring{width:40px;height:40px;min-width:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.book-item .bring > div{width:30px;height:30px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted);font-weight:700}
/* 书单视图：未归档阅读补标条目 */
.book-unfiled{padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:border-color .14s,background .14s}
.book-unfiled:hover{border-color:var(--line2);background:var(--bg2)}

/* ============ 目标分组 + 桌面两列 break-out（手机单列保持原样） ============ */
.ggroup{margin-bottom:20px}
.ggroup:last-child{margin-bottom:0}
.ggroup-hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 2px 9px;letter-spacing:.01em}
.ggroup-hd .chip{font-size:11px;font-weight:650}
.gitem{display:flex;flex-direction:column}
.gitem .gcard{margin-top:0}
/* 单项时让行占满，避免桌面双列下单卡占半栏留白 */
.glist:has(> .gitem:only-child){grid-template-columns:1fr !important}
@media(min-width:768px){
  .glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;align-items:start}
  .gitem.open{grid-column:1/-1}             /* break-out：展开时跨整行 */
  .gitem.open > .gcard{max-width:760px;margin:0 auto}  /* 展开卡不全宽，视觉聚焦 */
}

/* 分段切换控件（今日打卡/全部） */
.seg-ctrl{display:inline-flex;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--bg2)}
.seg-btn{border:0;background:transparent;padding:6px 14px;font-size:12.5px;font-weight:650;color:var(--muted);cursor:pointer;transition:.14s;white-space:nowrap}
.seg-btn.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(40,38,28,.08)}
.seg-btn:not(.on):hover{color:var(--ink2)}
@media(max-width:480px){ .seg-btn{padding:5px 11px;font-size:12px} }
/* 聚焦标签（从地图节点设为今日聚焦时显示） */
.focus-chip-row{margin:0 2px 10px}
.focus-chip{display:inline-flex;align-items:center;gap:6px;background:var(--pp-soft);border:1px solid var(--pp-line);color:var(--pp);font-size:12.5px;font-weight:650;padding:4px 10px;border-radius:99px}
.focus-chip .fc-x{border:0;background:transparent;color:var(--pp);cursor:pointer;padding:0;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;opacity:.6;transition:.14s}
.focus-chip .fc-x:hover{opacity:1;background:rgba(124,92,255,.12)}
/* 手机端：目标标题行换行，筛选和新建按钮不挤 */
@media(max-width:600px){
  .sec-title{flex-wrap:wrap;gap:6px}
  .sec-title .line{display:none}
  .sec-title .seg-ctrl{margin-left:0 !important}
  .sec-title .seg-btn{padding:5px 12px}
}

/* ============ V3 单张可缩放地图：日漫小路风 + 名称在下 ============ */
#pane-map{overflow:hidden}
.map-hero{flex:0 0 auto;padding:0 0 6px}
.map-canvas{
  position:relative;flex:1 1 auto;width:100%;max-width:760px;margin:0 auto;
  min-height:520px;height:calc(100vh - 220px);
  overflow:hidden;touch-action:none;border-radius:20px;
  background-color:#fbf8f1;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(120,110,86,.08) 1.4px, transparent 1.4px),
    radial-gradient(800px 300px at 50% 0%, #fdfbf6 0%, rgba(253,251,246,0) 60%),
    linear-gradient(180deg,#fbf8f1 0%,#f4efe4 100%);
  background-size:20px 20px, 100% 100%, 100% 100%;
  border:1px solid var(--line);box-shadow:var(--sh);
}
.map-viewport{position:absolute;inset:0;overflow:hidden}
.map-stage{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.map-svg-wrap{position:absolute;inset:0}
.map-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map-svg .map-path-edge{transition:stroke-opacity .25s,stroke-width .25s}
.map-svg .map-path-fill{transition:stroke-opacity .25s,stroke-width .25s}
.map-svg .map-path-edge.dim,.map-svg .map-path-fill.dim{stroke-opacity:.12}
.map-svg .map-path-edge.active{stroke-opacity:.85;stroke-width:7}
.map-svg .map-path-fill.active{stroke-opacity:1;stroke-width:3.5}
.map-overlay{position:absolute;inset:0;pointer-events:none}
.map-overlay>*{pointer-events:auto}
.map-item{position:absolute;transform:translate(-50%,-50%);z-index:3;transition:opacity .25s,filter .25s;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.map-item.dim{opacity:.28;filter:grayscale(.5)}
.map-item.active{z-index:8}
.map-item.selected{z-index:12}
.map-item.selected .map-icon-circle{transform:scale(1.15);box-shadow:0 12px 28px rgba(40,38,28,.28),0 0 0 5px rgba(111,158,126,.25)}
.map-item.active .map-icon-circle{transform:scale(1.1);box-shadow:0 10px 24px rgba(40,38,28,.22),0 0 0 4px rgba(111,158,126,.18)}
.map-icon-circle{
  position:relative;width:50px;height:50px;border-radius:50%;
  display:grid;place-items:center;color:#fff;
  background:var(--card);border:2px solid var(--line2);
  box-shadow:0 4px 10px rgba(40,38,28,.10),inset 0 -3px 0 rgba(0,0,0,.06);
  transition:transform .18s,box-shadow .18s;
}
.map-icon-circle.center{width:60px;height:60px;background:linear-gradient(135deg,#7fae8a 0%,#9cc2a6 60%,#cbb487 100%);border:0;box-shadow:0 8px 22px rgba(124,158,126,.40),inset 0 -3px 0 rgba(0,0,0,.10)}
.map-icon-circle.dir{border:0;color:#fff;box-shadow:0 6px 16px rgba(40,38,28,.18),inset 0 -3px 0 rgba(0,0,0,.12)}
.map-icon-circle.node{color:var(--ink2);border-width:2px}
.map-icon-circle.node .map-status-dot{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(40,38,28,.20)}
.map-name{font-size:11.5px;font-weight:700;color:var(--ink2);background:rgba(255,255,255,.92);border-radius:8px;padding:1px 8px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(40,38,28,.08);text-align:center}
.map-child-badge{position:absolute;top:-6px;right:-6px;font-size:10px;font-weight:700;color:#fff;background:var(--pp);border-radius:999px;padding:0 6px;line-height:15px;box-shadow:0 2px 5px rgba(111,158,126,.45);border:1.5px solid #fff;z-index:4}
.map-item-actions{position:absolute;left:calc(50% + 32px);top:50%;transform:translateY(-50%);display:flex;gap:3px;opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap;flex-direction:row;align-items:center}
.map-item:hover .map-item-actions,.map-item.active .map-item-actions{opacity:1;pointer-events:auto;z-index:15}
.map-item.selected .map-item-actions{opacity:1;pointer-events:auto;z-index:20}
.map-action-btn{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line2);box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink2);cursor:pointer;transition:.12s;padding:0;flex:0 0 auto}
.map-action-btn:hover{background:var(--pp-soft);color:var(--pp);border-color:var(--pp-line)}
.map-action-btn.add{background:var(--pp);color:#fff;border-color:var(--pp)}
.map-action-btn.add:hover{background:var(--pp2)}
.map-action-btn.del:hover{background:#f8e8e5;color:#d2695f;border-color:#d2695f}
.map-action-btn.det{background:var(--pp-soft);color:var(--pp);border-color:var(--pp-line)}
.map-action-btn.det:hover{background:var(--pp);color:#fff;border-color:var(--pp)}
.map-item.map-dir .map-action-btn.add{position:absolute;top:-6px;right:-6px;width:24px;height:24px;left:auto}
@media (max-width:480px){
  .map-item-actions{left:calc(50% + 26px)}
  .map-action-btn{width:24px;height:24px}
}
/* 左上角返回按钮 */
.map-back-btn{position:absolute;left:12px;top:12px;z-index:20;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.96);border:1px solid var(--line2);box-shadow:0 3px 10px rgba(40,38,28,.12);display:grid;place-items:center;color:var(--ink2);cursor:pointer;transition:.12s}
.map-back-btn:hover{background:var(--pp-soft);color:var(--pp);border-color:var(--pp-line);transform:scale(1.05)}
/* 右下角缩放按钮组 */
.map-zoom-ctrl{position:absolute;right:12px;bottom:60px;z-index:20;display:flex;flex-direction:column;gap:6px}
.map-zoom-ctrl button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.96);border:1px solid var(--line2);box-shadow:0 3px 10px rgba(40,38,28,.12);display:grid;place-items:center;color:var(--ink2);cursor:pointer;transition:.12s;padding:0}
.map-zoom-ctrl button:hover{background:var(--pp-soft);color:var(--pp);border-color:var(--pp-line);transform:scale(1.05)}
/* 选中节点浮动操作栏 */
.map-action-bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:6px;background:rgba(255,255,255,.98);border:1px solid var(--line2);border-radius:16px;box-shadow:0 6px 20px rgba(40,38,28,.18);padding:6px 8px;max-width:calc(100% - 100px)}
.map-action-bar.show{display:flex}
.map-action-bar .mab-label{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis;padding:0 4px 0 6px}
.map-action-bar .mab-btn{width:38px;height:38px;border-radius:10px;border:none;background:var(--bg2);display:grid;place-items:center;color:var(--ink2);cursor:pointer;transition:.12s;padding:0;flex:0 0 auto}
.map-action-bar .mab-btn:hover{background:var(--pp-soft);color:var(--pp)}
.map-action-bar .mab-btn.det:hover{background:var(--pp-soft);color:var(--pp)}
.map-action-bar .mab-btn.del:hover{background:#fde8e8;color:#c0392b}
@media (max-width:480px){
  .map-action-bar{bottom:10px;padding:5px 6px;gap:4px;max-width:calc(100% - 80px)}
  .map-action-bar .mab-label{font-size:11px;max-width:70px}
  .map-action-bar .mab-btn{width:34px;height:34px}
}
@media (max-width:480px){
  .map-icon-circle{width:42px;height:42px}
  .map-icon-circle.center{width:52px;height:52px}
  .map-name{font-size:10.5px;max-width:90px;padding:1px 6px}
  .map-back-btn{width:34px;height:34px;left:8px;top:8px}
  .map-zoom-ctrl button{width:30px;height:30px}
  .map-canvas{min-height:440px;height:calc(100vh - 180px)}
}

/* ============ 设计体验：桌面/移动端差异化 + 焦点/按压态 ============ */

/* ============ 每日回顾（今天页顶部，按天补记） ============ */
.dailyhub{padding:0;overflow:hidden}
.dailyhub-body{padding:0 16px 16px}
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 16px 0}
.rv-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--ink)}
.rv-title svg{color:var(--pp)}
.rv-switch{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rv-day{border:1px solid var(--line2);background:var(--bg2);color:var(--muted);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:650;cursor:pointer;transition:.14s}
.rv-day.on{background:var(--pp);border-color:var(--pp);color:#fff}
.rv-date{border:1px solid var(--line2);border-radius:9px;padding:5px 8px;font-size:12.5px;color:var(--ink2);background:var(--card);font-family:inherit}
.rv-backfill{display:flex;align-items:center;gap:6px;margin:10px 16px 0;padding:8px 12px;border-radius:10px;background:#fff7e6;border:1px solid #ffe0a3;color:#9a6b18;font-size:12.5px}
.rv-backfill svg{color:#d99a1e;flex:0 0 auto}
.rv-meta{font-size:12.5px;color:var(--muted)}
.rv-meta b{color:var(--ink2)}
.rv-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:2px}
.rv-chip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;transition:.14s;position:relative}
.rv-chip .d{font-size:13px;font-weight:700;color:var(--ink2)}
.rv-chip .w{font-size:9.5px;color:var(--muted)}
.rv-chip .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:transparent}
.rv-chip.has .dot{background:var(--pp)}
.rv-chip.done{border-color:#bfe6c9;background:#eafaf0}
.rv-chip.done .dot{background:#2faa5b}
.rv-chip.on{box-shadow:0 0 0 2px var(--pp-soft);border-color:var(--pp)}
@media(max-width:480px){ .rv-strip{gap:4px} .rv-chip .w{display:none} .rv-chip .d{font-size:12px} }

/* 键盘导航可见焦点（桌面为主） */
:focus-visible{outline:2px solid var(--pp);outline-offset:2px;border-radius:8px}

/* 触屏按压反馈（移动端无 hover，用 :active 给触感） */
.btn:active,.iconbtn:active,.navbtn:active,.mitchk:active,.mitclear:active,.newbig:active{transform:scale(.96)}

/* 桌面端（有鼠标）才启用卡片悬浮抬升，触屏不触发粘连态 */
@media (hover:hover) and (pointer:fine){
  .card.gcard{transition:transform .16s ease,box-shadow .16s ease}
  .card.gcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
}

/* 桌面大屏：地图用满横向空间 */
@media (min-width:1024px){ .map-canvas{max-width:900px} }

/* ===== 复盘页 redesign (2026-08) ===== */
.muted2{color:var(--muted);font-weight:400;font-size:12px}
.rv-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.rv-nav-mid{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.rv-nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.rv-month{width:auto;font-size:13px;padding:5px 9px}

/* 本周概览 hero */
.rv-hero{padding:16px;margin-bottom:6px}
.rv-hero-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wh-seg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--bg2);border:1.5px solid transparent;cursor:pointer;transition:.15s}
.wh-seg:hover{transform:translateY(-2px)}
.wh-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card);color:var(--muted);font-size:13px;font-weight:800;border:1.5px solid var(--line2);transition:.15s}
.wh-seg.done .wh-ic{background:var(--gr);border-color:var(--gr);color:#fff}
.wh-seg.today .wh-ic{border-color:var(--pp);color:var(--pp);box-shadow:0 0 0 3px var(--pp-soft)}
.wh-seg.today{background:var(--pp-soft)}
.wh-seg.future{opacity:.5}

      bookId: r.bookId || null      /* 归类到哪本书；旧记录无此字段→null（未归档） */
    });
  });

  out.nodes = Array.isArray(raw.nodes) ? raw.nodes.map(function(n){
    return {
      id: n.id || uid(),
      dirId: String(n.dirId || 'work').slice(0,12),
      parent: (n.parent && String(n.parent).slice(0,24)) || '',
      name: String(n.name || '未命名节点').slice(0,40),
      desc: String(n.desc || '').slice(0,200),
      status: (typeof n.status === 'number' && n.status>=0 && n.status<=3) ? n.status : 0,
      goal: String(n.goal || '').slice(0,200),
      createdAt: String(n.createdAt || todayStr()).slice(0,10),
      updatedAt: String(n.updatedAt || n.createdAt || todayStr()).slice(0,10),
      taskIds: Array.isArray(n.taskIds) ? n.taskIds.filter(function(x){ return typeof x==='string' && x; }).slice(0,80) : []
    };
  }) : [];
  out.weekly = (raw.weekly && typeof raw.weekly === 'object') ? raw.weekly : {};
  var st = (raw.settings && typeof raw.settings === 'object') ? raw.settings : {};
  out.settings = Object.assign(blank().settings, st);
  if(!out.settings.drafts || typeof out.settings.drafts !== 'object') out.settings.drafts = {};
  if(!out.settings.punch || typeof out.settings.punch !== 'object') out.settings.punch = {};
  if(!Array.isArray(out.settings.mitLog)) out.settings.mitLog = [];
  if(!Array.isArray(out.settings.dailyLog)) out.settings.dailyLog = [];
  migrateDays(out.settings);
  if(Number(raw.version||0) !== VERSION) changed++;
  out.__migrated = changed;
  return out;
}

/* 把旧版 今日三件事/复盘（mit/daily/mitLog/dailyLog）合并进按天的 days 映射，支持补记任意一天 */
function migrateDays(st){
  st.days = (st.days && typeof st.days === 'object') ? st.days : {};
  if(Object.keys(st.days).length > 0) return;   /* 已迁移过，不覆盖 */
  function day(date){
    return st.days[date] || (st.days[date] = { mit:[{text:'',done:false},{text:'',done:false},{text:'',done:false}], goods:'', tomorrow:'', done:false });
  }
  if(st.mit && st.mit.date){
    var a = day(st.mit.date);
    a.mit = (st.mit.items||[]).map(function(x){ return { text:(x.text||'').trim(), done:!!x.done }; });
  }
  if(st.daily && st.daily.date){
    var b = day(st.daily.date);
    b.goods = (st.daily.goods||'').trim();
    b.tomorrow = (st.daily.tomorrow||'').trim();
  }
  (st.mitLog||[]).forEach(function(m){ if(m && m.date){ var d = day(m.date); d.mit = (m.items||[]).map(function(x){ return { text:(x.text||'').trim(), done:!!x.done }; }); } });
  (st.dailyLog||[]).forEach(function(m){ if(m && m.date){ var d = day(m.date); d.goods = (m.goods||'').trim(); d.tomorrow = (m.tomorrow||'').trim(); } });
  Object.keys(st.days).forEach(function(k){
    var d = st.days[k];
    d.done = !!(d.goods && d.goods.trim()) || !!(d.tomorrow && d.tomorrow.trim()) || d.mit.some(function(x){ return x.text && x.text.trim(); });
  });
}

/* 任务↔节点 N 对 N 双向关联：node.taskIds + goal.nodeIds */
function migrateTasks(){
  if(!S || !S.nodes) return;
  S.nodes.forEach(function(n){ if(!Array.isArray(n.taskIds)) n.taskIds = []; });
  S.goals.forEach(function(g){
    if(!Array.isArray(g.nodeIds)) g.nodeIds = [];
    if(g.nodeId && g.nodeIds.indexOf(g.nodeId) < 0) g.nodeIds.push(g.nodeId);
    g.nodeIds.forEach(function(nid){ var nd=nodeOf(nid); if(nd && nd.taskIds.indexOf(g.id) < 0) nd.taskIds.push(g.id); });
  });
  S.nodes.forEach(function(n){ n.taskIds = n.taskIds.filter(function(gid){ return !!goalById(gid); }); });
  S.goals.forEach(function(g){ g.nodeIds = g.nodeIds.filter(function(nid){ return !!nodeOf(nid); }); });
}
function linkGoalToNode(goalId, nodeId){
  var g = goalById(goalId), nd = nodeOf(nodeId); if(!g || !nd) return;
  if(!Array.isArray(nd.taskIds)) nd.taskIds = [];
  if(!Array.isArray(g.nodeIds)) g.nodeIds = [];
  if(nd.taskIds.indexOf(goalId) < 0) nd.taskIds.push(goalId);
  if(g.nodeIds.indexOf(nodeId) < 0) g.nodeIds.push(nodeId);
}
function unlinkGoalFromNode(goalId, nodeId){
  var g = goalById(goalId), nd = nodeOf(nodeId); if(!g && !nd) return;
  if(nd && nd.taskIds) nd.taskIds = nd.taskIds.filter(function(x){ return x!==goalId; });
  if(g && g.nodeIds) g.nodeIds = g.nodeIds.filter(function(x){ return x!==nodeId; });
}
function setGoalNodes(goalId, nodeIds){
  var g = goalById(goalId); if(!g) return;
  if(!Array.isArray(g.nodeIds)) g.nodeIds = [];
  var before = g.nodeIds.slice();
  g.nodeIds = nodeIds.filter(function(nid){ return !!nodeOf(nid); });
  before.forEach(function(nid){ if(g.nodeIds.indexOf(nid) < 0){ var nd=nodeOf(nid); if(nd && nd.taskIds) nd.taskIds = nd.taskIds.filter(function(x){ return x!==goalId; }); } });
  g.nodeIds.forEach(function(nid){ linkGoalToNode(goalId, nid); });
}
function setNodeTasks(nodeId, goalIds){
  var nd = nodeOf(nodeId); if(!nd) return;
  if(!Array.isArray(nd.taskIds)) nd.taskIds = [];
  var before = nd.taskIds.slice();
  nd.taskIds = goalIds.filter(function(gid){ return !!goalById(gid); });
  before.forEach(function(gid){ if(nd.taskIds.indexOf(gid) < 0){ var g=goalById(gid); if(g && g.nodeIds) g.nodeIds = g.nodeIds.filter(function(x){ return x!==nodeId; }); } });
  nd.taskIds.forEach(function(gid){ linkGoalToNode(gid, nodeId); });
}

/* ===================== 1.5 云端同步（GitHub Gist） =====================
   多设备同步：每次本地改动后防抖推送（约 2 秒）；进入页面拉一次 + 每 60s 周期拉取。
   合并策略：远端 updatedAt > 本地 lastLocalMtime 则用远端覆盖本地。
   安全：Token 仅存 localStorage，不上传到部署服务器；Gist 设为 secret（私有）。
   ====================================================== */
var SYNC_KEY = 'wb_goalhub_sync';
var GIST_FILENAME = 'goal-hub-data.json';
var GIST_DESC = '成长工作台数据（自动同步）';
var GIST_API = 'https://api.github.com/gists';

function loadSyncState(){
  try { return JSON.parse(localStorage.getItem(SYNC_KEY) || '{}') || {}; }
  catch(e){ return {}; }
}
function saveSyncState(){
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncState)); } catch(e){}
}
var syncState = loadSyncState();
syncState.token = syncState.token || '';
syncState.gistId = syncState.gistId || '';
syncState.lastPushAt = syncState.lastPushAt || 0;
syncState.lastPullAt = syncState.lastPullAt || 0;
syncState.lastRemoteAt = syncState.lastRemoteAt || 0;
syncState.lastLocalMtime = syncState.lastLocalMtime || 0;
syncState.user = syncState.user || '';
syncState.status = syncState.token ? (syncState.status || 'ok') : 'idle';
syncState.error = syncState.error || '';

function gistHeaders(){
  return {
    'Authorization': 'token ' + syncState.token,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}
function packSnapshot(){
  return {
    app: 'goal-hub',
    version: VERSION,
    updatedAt: new Date().toISOString(),
    goals: S.goals,
    records: S.records,
    nodes: S.nodes,
    weekly: S.weekly,
    settings: S.settings
  };
}
function gistValidateToken(token){
  var userLogin;
  // 第一步：验证 Token 有效性
  return fetch('https://api.github.com/user', { headers: {
    'Authorization': 'token ' + token,
    'Accept': 'application/vnd.github+json'
  } })
    .then(function(r){
      if(!r.ok) throw new Error('Token 无效或已过期 (HTTP ' + r.status + ')');
      // 从响应头获取 OAuth scopes
      var scopes = r.headers.get('x-oauth-scopes') || '';
      userLogin = r.json().then(function(u){ return u.login; });
      // 检查是否有 gist 权限
      if (scopes && scopes.indexOf('gist') === -1) {
        throw new Error('Token 缺少 gist 权限，请在 GitHub 重新生成 Token 时勾选 gist scope');
      }
      return userLogin;
    })
    .then(function(login){
      // 第二步：验证 Token 能访问 Gist API
      return fetch('https://api.github.com/gists?per_page=1', { headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github+json'
      } }).then(function(r2){
        if (!r2.ok) {
          if (r2.status === 403) throw new Error('Token 没有访问 Gist 的权限 (HTTP 403 Forbidden)');
          throw new Error('无法访问 Gist API (HTTP ' + r2.status + ')');
        }
        return login;
      });
    });
}
function gistFetchById(id){
  return fetch(GIST_API + '/' + id, { headers: gistHeaders() })
    .then(function(r){
      if (r.status === 404) return null;
      if (!r.ok){
        var limit = r.headers.get('x-ratelimit-remaining');
        if(r.status === 403 && limit === '0') throw new Error('GitHub 频率限制：请求过于频繁，请等 15-30 分钟后再试');
        throw new Error('读取 Gist 失败 (HTTP ' + r.status + ')');
      }
      return r.json();
    });
}
function gistListAndFind(){
  return fetch(GIST_API + '?per_page=100', { headers: gistHeaders() })
    .then(function(r){ if(!r.ok) throw new Error('列出 Gist 失败 (HTTP ' + r.status + ')'); return r.json(); })
    .then(function(list){
      // 查找所有匹配的 Gist，按更新时间排序，取最新的
      var matches = [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].description === GIST_DESC) {
          matches.push(list[i]);
        }
      }
      if (matches.length === 0) return null;
      // 按 updated_at 排序，取最新的
      matches.sort(function(a, b){
        return new Date(b.updated_at) - new Date(a.updated_at);
      });
      // 如果有多个同描述的 Gist，清除旧的
      if (matches.length > 1) {
        console.warn('发现 ' + matches.length + ' 个同步 Gist，将使用最新的：' + matches[0].id);
      }
      syncState.gistId = matches[0].id; saveSyncState();
      return matches[0];
    });
}
function gistFindOrCreate(){
  // 优先使用已保存的 gistId
  if (syncState.gistId) {
    return gistFetchById(syncState.gistId).then(function(g){
      if (g) return g;
      // gistId 失效了，清除并重新查找
      syncState.gistId = ''; saveSyncState();
      return gistListAndFind().then(function(g2){ return g2 || gistCreateNew(); });
    });
  }
  // 没有 gistId，先查找是否存在
  return gistListAndFind().then(function(g){
    if (g) return g;
    // 不存在则创建新的
    return gistCreateNew();
  });
}
function gistCreateNew(){
  var body = { description: GIST_DESC, public: false, files: {} };
  body.files[GIST_FILENAME] = { content: JSON.stringify(packSnapshot(), null, 2) };
  return fetch(GIST_API, {
    method: 'POST', headers: gistHeaders(), body: JSON.stringify(body)
  })
    .then(function(r){ if(!r.ok) throw new Error('创建 Gist 失败 (HTTP ' + r.status + ')'); return r.json(); })
    .then(function(g){ syncState.gistId = g.id; saveSyncState(); return g; });
}
var syncBusy = false;
function syncPush(opts){
  opts = opts || {};
  if (!syncState.token) return Promise.resolve(false);
  if (syncBusy && !opts.force) return Promise.resolve(false);
  syncBusy = true;
  syncState.status = 'pushing'; saveSyncState(); updateSyncUI();
  return gistFindOrCreate()
    .then(function(g){
      if (!g || !g.id) throw new Error('未找到 Gist');
      var body = { files: {} };
      body.files[GIST_FILENAME] = { content: JSON.stringify(packSnapshot(), null, 2) };
      return fetch(GIST_API + '/' + g.id, {
        method: 'PATCH', headers: gistHeaders(), body: JSON.stringify(body)
      });
    })
    .then(function(r){
      if(!r.ok){
        var limit = r.headers.get('x-ratelimit-remaining');
        if(r.status === 403 && limit === '0') throw new Error('GitHub 频率限制：请求过于频繁，请等 15-30 分钟后再试');
        throw new Error('推送失败 (HTTP ' + r.status + ')');
      }
      return r.json();
    })
    .then(function(g){
      syncState.lastPushAt = Date.now();
      syncState.lastLocalMtime = syncState.lastPushAt;
      if (g && g.history && g.history[0]) syncState.lastRemoteAt = Date.parse(g.history[0].committed_at) || Date.now();
      syncState.status = 'ok'; syncState.error = ''; saveSyncState(); updateSyncUI();
      return true;
    })
    .catch(function(e){
      syncState.status = 'error'; syncState.error = e.message; saveSyncState(); updateSyncUI();
      return false;
    })
    .then(function(ok){ syncBusy = false; return ok; });
}
function syncPull(opts){
  opts = opts || {};
  if (!syncState.token) return Promise.resolve(false);
  if (syncBusy && !opts.force) return Promise.resolve(false);
  syncBusy = true;
  syncState.status = 'pulling'; saveSyncState(); updateSyncUI();
  return gistFindOrCreate()
    .then(function(g){
      var file = g && g.files && g.files[GIST_FILENAME];
      if (!file || !file.raw_url) {
        syncBusy = false;
        return syncPush({ force: true }).then(function(){ return true; });
      }
      return fetch(file.raw_url).then(function(r){ if(!r.ok) throw new Error('下载远端数据失败'); return r.text(); })
        .then(function(text){
          var raw;
          try { raw = JSON.parse(text); } catch(e) { throw new Error('远端数据格式错误'); }
          var remote = normalize(raw);
          if (!remote || !remote.goals) throw new Error('远端数据无效');
          var remoteMtime = raw.updatedAt ? Date.parse(raw.updatedAt) : 0;
          if (remoteMtime > syncState.lastLocalMtime || opts.force) {
            var beforeSig = JSON.stringify({ g: S.goals, r: S.records, n: S.nodes });
            S.goals = remote.goals; S.records = remote.records;
            S.nodes = remote.nodes || []; S.weekly = remote.weekly || {};
            if (remote.settings) S.settings = Object.assign(S.settings || blank().settings, remote.settings);
            migrateTasks();
            save();
            renderAll();
            syncState.lastLocalMtime = remoteMtime || Date.now();
            var afterSig = JSON.stringify({ g: S.goals, r: S.records, n: S.nodes });
            if (opts.notify) {
              if (afterSig === beforeSig) toast('云端与本地一致，无变化');
              else toast('✅ 已从云端同步 ' + (remote.goals ? remote.goals.length : 0) + ' 个目标');
            }
          } else if (opts.notify) {
            toast('云端与本地一致，无变化');
          }
          syncState.lastPullAt = Date.now();
          syncState.lastRemoteAt = remoteMtime || Date.now();
          syncState.status = 'ok'; syncState.error = ''; saveSyncState(); updateSyncUI();
          return true;
        });
    })
    .catch(function(e){
      syncState.status = 'error'; syncState.error = e.message; saveSyncState(); updateSyncUI();
      return false;
    })
    .then(function(ok){ syncBusy = false; return ok; });
}
var pushDebounce = null;
function syncPushDebounced(){
  if (!syncState.token) return;
  if (pushDebounce) clearTimeout(pushDebounce);
  pushDebounce = setTimeout(function(){ syncPush(); }, 2000);
}
function syncAuto(){
  if (!syncState.token) return;
  syncPull().then(function(){
    setInterval(function(){ if (!syncBusy) syncPull(); }, 300000);
  });
}
function syncUnbind(){
  syncState = { token:'', gistId:'', lastPushAt:0, lastPullAt:0, lastRemoteAt:0, lastLocalMtime:0, user:'', status:'idle', error:'' };
  saveSyncState(); updateSyncUI();
}
function fmtTime(ts){
  if (!ts) return '从未';
  var d = new Date(ts);
  function p(n){ return (n<10?'0':'')+n; }
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function saveSyncToken(){
  var tk = ($('#sync-token').value || '').trim();
  if (!tk) { toast('请粘贴 Token'); return; }
  closeModal();
  toast('正在验证 Token…');
  syncState.status = 'pulling'; syncState.error=''; saveSyncState(); updateSyncUI();
  gistValidateToken(tk)
    .then(function(user){
      syncState.token = tk; syncState.user = user;
      saveSyncState();
      // 关键修复：若已通过「通用链接」预填了 Gist（applyHashSync 设置了 gistId），
      // 必须死守这个固定 Gist，禁止再盲抓"最新的同名 Gist"——否则会把设备重新绑到
      // 错误的幽灵 Gist，导致多设备永远对不上（昨天 trae 部署残留的 Gist 比正确的新）。
      if (syncState.gistId) {
        toast('正在从通用链接指定的 Gist 同步…');
        return gistFetchById(syncState.gistId).then(function(g){
          if (g) return syncPull({ force: true, notify: true });
          // 该 Gist 已失效，才退回自动发现
          syncState.gistId = ''; saveSyncState();
          return gistListAndFind().then(function(ex){
            if (ex) { toast('找到已有同步数据，正在拉取…'); return syncPull({ force: true, notify: true }); }
            toast('首次配置，正在创建同步数据…'); return syncPush({ force: true });
          });
        });
      }
      // 没有预填 Gist：自动查找同名 Gist
      toast('Token 已验证，@' + user + '；正在查找同步数据…');
      return gistListAndFind().then(function(existingGist){
        if (existingGist) {
          toast('找到已有同步数据，正在拉取…');
          return syncPull({ force: true, notify: true });
        } else {
          toast('首次配置，正在创建同步数据…');
          return syncPush({ force: true });
        }
      });
    })
    .then(function(){
      syncState.status = 'ok'; syncState.error = '';
      saveSyncState(); updateSyncUI();
      toast('同步完成！');
    })
    .catch(function(e){
      syncState.status = 'error'; syncState.error = e.message;
      saveSyncState(); updateSyncUI();
      toast('同步失败：' + e.message);
      console.error('同步失败详情:', e);
    });
}

function startDateOf(g, recs){
  var s = g.createdAt;
  recs.forEach(function(r){ if(diffDays(r.date, s) > 0) s = r.date; });
  return s;
}

/* 连续打卡天数：每周（周一起）自动使用 1 个休息日
   —— 该周「时间上第一个」漏打卡的日子可被豁免，第二次漏就断。 */
function computeStreak(g, byDate, T){
  var start = startDateOf(g, []);
  var st = g.__startDate || start;
  var yest = addDays(T,-1);
  var missed = [];
  if(diffDays(st, yest) >= 0){
    var cur = st, guard = 0;
    while(diffDays(cur, yest) >= 0 && guard++ < 2000){
      if(!byDate[cur]) missed.push(cur);
      cur = addDays(cur,1);
    }
  }
  var freeByWeek = {};
  missed.forEach(function(m){ var wk = weekStartOf(m); if(!(wk in freeByWeek)) freeByWeek[wk] = m; });

  var streak = 0, restUsed = 0, brokeAt = null;
  if(byDate[T]) streak++;
  var c = addDays(T,-1), guard2 = 0;
  while(diffDays(st, c) >= 0 && guard2++ < 2000){
    if(byDate[c]){ streak++; c = addDays(c,-1); continue; }
    if(freeByWeek[weekStartOf(c)] === c){ restUsed++; c = addDays(c,-1); continue; }
    brokeAt = c; break;
  }
  var yMissed = !byDate[yest] && diffDays(st, yest) >= 0;
  var thisWeekRest = freeByWeek[weekStartOf(T)] || null;
  return {
    streak: streak,
    restUsedInStreak: restUsed,
    brokeAt: brokeAt,
    yesterdayMissed: yMissed,
    yesterdayForgiven: yMissed && freeByWeek[weekStartOf(yest)] === yest,
    thisWeekRestDay: thisWeekRest
  };
}

/* 预计完成日：近 7 天平均速度；样本不足返回 null，绝不编数字 */
function computeForecast(g, recs, remaining, T){
  if(remaining <= 0) return { done:true };
  var from = addDays(T,-6);
  var days = {}, sum = 0;
  recs.forEach(function(r){
    if(diffDays(from, r.date) >= 0 && diffDays(r.date, T) >= 0){ days[r.date] = 1; sum += r.amount; }
  });
  var activeDays = Object.keys(days).length;
  if(activeDays < 3 || sum <= 0) return { insufficient:true, activeDays:activeDays, need: 3 - activeDays };
  var span = clamp(diffDays(g.__startDate, T) + 1, 1, 7);
  var avg = sum / span;
  var needDays = Math.ceil(remaining / avg);
  if(!isFinite(needDays) || needDays > 3650) return { tooSlow:true, avg:avg };
  var date = addDays(T, needDays);
  var gap = diffDays(date, g.deadline); // >0 提前，<0 拖后
  return { date:date, needDays:needDays, avg:avg, gap:gap, activeDays:activeDays };
}

function computeGoal(g){
  var T = todayStr();
  var recs = recsOf(g.id).sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  var byDate = {};
  var done = 0;
  recs.forEach(function(r){ done += r.amount; byDate[r.date] = (byDate[r.date]||0) + r.amount; });
  g.__startDate = startDateOf(g, recs);
  var remaining = Math.max(0, g.total - done);
  var pct = g.total > 0 ? clamp(done / g.total, 0, 1) : 0;
  var daysLeft = diffDays(T, g.deadline);          // 0 = 今天到期，负数 = 逾期
  var overdue = daysLeft < 0 ? -daysLeft : 0;
  var remainDays = Math.max(1, daysLeft + 1);
  var weeklyPer = (g.cadence && g.cadence.type === 'weekly' && g.cadence.per > 0) ? g.cadence.per : null;
  var isWeekly = !!weeklyPer;
  var weekDone = 0, weekActiveDays = 0;
  if(isWeekly){
    var ws0 = weekStartOf(T);
    var wdMap = {};
    recs.forEach(function(r){ if(diffDays(ws0, r.date) >= 0 && diffDays(r.date, T) >= 0){ weekDone += r.amount; wdMap[r.date] = 1; } });
    weekActiveDays = Object.keys(wdMap).length;
  }
  var suggest = remaining <= 0 ? 0
    : isWeekly ? Math.max(0, weeklyPer - weekDone)
    : Math.max(1, Math.ceil(remaining / remainDays));
  var sk = computeStreak(g, byDate, T);
  var fc = computeForecast(g, recs, remaining, T);
  return {
    g:g, recs:recs, byDate:byDate, done:done, remaining:remaining, pct:pct,
    daysLeft:daysLeft, overdue:overdue, remainDays:remainDays, suggest:suggest,
    isWeekly:isWeekly, weeklyPer:weeklyPer, weekDone:weekDone, weekActiveDays:weekActiveDays,
    todayAmount: byDate[T] || 0, complete: remaining <= 0,
    streak:sk, fc:fc
  };
}
function allComputed(){ return S.goals.map(computeGoal); }

/* 根据当前时间判断属于哪个 TIME_SLOTS 时段（23:00–06:30 sleep 空档返回 null）
   range 用半角破折号 –(U+2013) 分隔，与 todayRhythm 的 split('–') 模式一致 */
function currentSlot(){
  var now = new Date();
  var cur = now.getHours()*60 + now.getMinutes();
  for(var i=0;i<TIME_SLOTS.length;i++){
    var parts = TIME_SLOTS[i].range.split('–');
    if(parts.length < 2) continue;
    var s = parts[0].split(':'), e = parts[1].split(':');
    var sm = (+s[0])*60 + (+s[1]);
    var em = (+e[0])*60 + (+e[1]);
    if(cur >= sm && cur < em) return TIME_SLOTS[i];
  }
  return null;
}

}

var fxCv = $('#fx'), fxCtx = fxCv.getContext('2d'), fxP = [], fxRaf = null;
function confetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fxCv.style.display = 'block';
  fxCv.width = innerWidth; fxCv.height = innerHeight;
  var cols = ['#7c5cff','#a06bff','#c47bff','#0fae7f','#f59f0a','#3b82f6','#ec4899'];
  fxP = [];
  for(var i=0;i<130;i++){
    fxP.push({ x: innerWidth*(.2+Math.random()*.6), y: -20 - Math.random()*innerHeight*.4,
      w: 6+Math.random()*7, h: 8+Math.random()*10,
      vx: (Math.random()-.5)*2.6, vy: 2.4+Math.random()*3.6,
      rot: Math.random()*Math.PI, vr:(Math.random()-.5)*.28,
      c: cols[(Math.random()*cols.length)|0] });
  }
  if(fxRaf) cancelAnimationFrame(fxRaf);
  var t0 = Date.now();
  (function step(){
    fxCtx.clearRect(0,0,fxCv.width,fxCv.height);
    var alive = 0;
    fxP.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.rot += p.vr;
      if(p.y < fxCv.height + 40){ alive++; }
      fxCtx.save(); fxCtx.translate(p.x,p.y); fxCtx.rotate(p.rot);
      fxCtx.fillStyle = p.c; fxCtx.globalAlpha = .92;
      fxCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h); fxCtx.restore();
    });
    if(alive > 0 && Date.now()-t0 < 5200){ fxRaf = requestAnimationFrame(step); }
    else { fxCtx.clearRect(0,0,fxCv.width,fxCv.height); fxCv.style.display='none'; }
  })();
}

function forecastText(c){
  var f = c.fc;
  if(f.done) return { main:'已达成', sub:'', cls:'gr' };
  if(f.insufficient) return { main:'暂无推算', sub:'近 7 天仅 '+f.activeDays+' 天有记录，再记 '+f.need+' 天可推算', cls:'' };
  if(f.tooSlow) return { main:'暂无推算', sub:'按近 7 天速度看不到终点，先把节奏提上来', cls:'' };
  var sub = f.gap > 0 ? ('比截止日提前 '+f.gap+' 天') : (f.gap < 0 ? ('比截止日拖后 '+(-f.gap)+' 天') : '正好卡在截止日');
  return { main: md(f.date), sub: sub, cls: f.gap >= 0 ? 'gr' : 'rd' };
}

/* 「此刻该做」聚焦卡 + 提醒概览
   - slot 有值时优先挑 fitTimes 含 slot.fit 的非庆祝提醒；
   - 找不到则退化为最高优先级非庆祝提醒（用户已确认采用此兜底）；
   - 全都没有时返回占位「自由安排」卡。 */
function renderNowFocus(alerts, slot){
  var focus = null, sub;
  if(slot){
    sub = '此刻属于「'+slot.cn+'」时段';
    for(var i=0;i<alerts.length;i++){
      var a = alerts[i];
      if(a.p === 0) continue;                  // 完成庆祝卡不当「此刻该做」
      if(a.fitTimes.indexOf(slot.fit) >= 0){ focus = a; break; }
    }
  } else {
    sub = '当前不在固定时段';
  }
  if(!focus){
    focus = alerts.filter(function(a){ return a.p > 0; })[0] || null;
    if(focus) sub += '· 按提醒优先级'; else sub += '· 自由安排';
  }
  var tiers = [
    { p:1, cls:'rd',  lbl:'逾期·断卡' },
    { p:2, cls:'am',  lbl:'休息日' },
    { p:3, cls:'pp',  lbl:'即将到期' },
    { p:4, cls:'pp',  lbl:'待打卡' },
    { p:0, cls:'gr',  lbl:'完成' }
  ];
  var counts = tiers.map(function(t){
    var n = alerts.filter(function(a){ return a.p === t.p; }).length;
    return n ? '<button class="chip '+t.cls+'" data-act="open-alert-sheet">'+t.lbl+' ×'+n+'</button>' : '';
  }).join('');
  var focusHTML = focus
    ? '<div class="alert-focus"><div class="af-tag">'+ic(slot?slot.icon:'moon',15)+esc(sub)+'</div>'+focus.html+'</div>'
    : '<div class="alert-focus"><div class="af-tag">'+ic(slot?slot.icon:'moon',15)+esc(sub)+'</div>'+
      '<div class="alert"><div class="ah">'+ic('leaf',18)+'此刻没有待办</div>'+
      '<div class="am2 muted">当前时间段没有匹配的目标，也没有逾期或即将到期的提醒。按你今天的节奏自由安排，或者先休息一下。</div></div></div>';
  return { focusHTML:focusHTML, overviewHTML: counts ? '<div class="alert-overview">'+counts+'</div>' : '' };
}

/* 按今日打卡状态分组：①今天待打卡 ②今天已打卡 ③已达成
   组1 内逾期优先，其余按名称；空组返回时不出现 */
function groupGoals(list, T){
  var g1=[], g2=[], g3=[];
  list.forEach(function(c){
    if(c.complete) g3.push(c);
    else if(c.byDate[T]) g2.push(c);
    else g1.push(c);
  });
  g1.sort(function(a,b){
    var ao = a.overdue>0?0:1, bo = b.overdue>0?0:1;
    if(ao !== bo) return ao - bo;
    return a.g.name.localeCompare(b.g.name);
  });
  [g2,g3].forEach(function(arr){ arr.sort(function(a,b){ return a.g.name.localeCompare(b.g.name); }); });
  return [
    { k:'todo', ttl:'今天待打卡', items:g1 },
    { k:'done', ttl:'今天已打卡', items:g2 },
    { k:'arch', ttl:'已达成',     items:g3 }
  ].filter(function(grp){ return grp.items.length > 0; });
}

function goalRow(c, open){
  var g = c.g, pct = Math.round(c.pct*100);
  var stat = c.complete ? '已达成'
    : c.overdue>0 ? ('逾期 '+c.overdue+' 天 · 剩 '+n1(c.remaining)+' '+esc(g.unit))
    : (c.isWeekly ? ('本周 '+n1(c.weekDone)+'/'+c.weeklyPer+' 篇 · 连续 '+c.streak.streak+' 天')
    : ('今日建议 '+n1(c.suggest)+' '+esc(g.unit)+' · 连续 '+c.streak.streak+' 天'));
  var quick = (g.isIntel || c.complete) ? '' : '<button class="gquick" data-act="quick-punch" data-id="'+g.id+'" title="一键打卡今日建议量" aria-label="一键打卡">'+ic('check',16)+'</button>';
  return '<div class="grow'+(open?' open':'')+(c.complete?' done':'')+'" data-act="toggle-goal" data-id="'+g.id+'">'+
    '<span class="gdot" style="background:'+g.color+'"></span>'+
    '<span class="gmain"><span class="gname">'+esc(g.name)+'</span><span class="gstat">'+stat+'</span></span>'+
    '<span class="gbar"><i style="width:'+pct+'%;background:'+g.color+'"></i></span>'+
    quick+
    '<span class="gchev">'+ic('chevron',14)+'</span>'+
  '</div>';
}

/* ---------- 每日回顾：三件事 + 复盘，按「天」存储，可补记任意过往一天 ---------- */
var REVIEW_DAY = null;
function curReviewDay(){ return (REVIEW_DAY && /^\d{4}-\d{2}-\d{2}$/.test(REVIEW_DAY)) ? REVIEW_DAY : todayStr(); }
function dayState(date){
  date = date || todayStr();
  var D = S.settings.days = S.settings.days || {};
  if(!D[date]) D[date] = { mit:[{text:'',done:false},{text:'',done:false},{text:'',done:false}], goods:'', tomorrow:'', done:false };
  var d = D[date];
  if(!Array.isArray(d.mit) || d.mit.length === 0) d.mit = [{text:'',done:false},{text:'',done:false},{text:'',done:false}];
  while(d.mit.length < 3) d.mit.push({ text:'', done:false });
  d.mit = d.mit.slice(0,3);
  if(typeof d.done !== 'boolean') d.done = false;
  if(typeof d.goods !== 'string') d.goods = '';
  if(typeof d.tomorrow !== 'string') d.tomorrow = '';
  return d;
}
/* 兼容旧调用（默认取今天） */
function mitState(){ return dayState(todayStr()); }
function dailyState(){ return dayState(todayStr()); }
function reviewStreak(){
  var D = S.settings.days || {}, n = 0, d = todayStr();
  while(D[d] && D[d].done){ n++; d = addDays(d,-1); }
  return n;
}

/* —— 统一复盘页：周包含日（一周 7 天的回顾汇总 + 每周反思） —— */

var RC_WEEK = null; /* 当前查看的周（YYYY-MM-DD，周一） */
function openReviewCenter(){ closeModal(); setTab('review', true); }
