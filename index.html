  html += '<div class="sec-title">'+ic('clock',15)+'历史回顾<span class="line"></span></div>';
  html += '<div id="rc-history">'+renderReviewHistory()+'</div>';

  pane.innerHTML = html;
}

function renderWeekHero(cw, T, isThis, todayDone){
  var D = S.settings.days || {};
  var doneCnt = 0, seg = '';
  for(var i=0;i<7;i++){
    var dt = addDays(cw,i), d = D[dt];
    var done = !!(d && d.done), isFuture = diffDays(dt,T) > 0, isToday = dt === T;
    if(done) doneCnt++;
    var cls = 'wh-seg'+(done?' done':'')+(isToday?' today':'')+(isFuture?' future':'');
    var inner = done ? ic('check',13) : (isToday ? '今' : wdOf(dt));
    seg += '<button class="'+cls+'" data-act="rc-jump-day" data-d="'+dt+'" title="'+md(dt)+' 周'+wdOf(dt)+(done?'（已回顾）':'')+'">'+
      '<span class="wh-ic">'+inner+'</span><span class="wh-wd">周'+wdOf(dt)+'</span></button>';
  }
  var streak = reviewStreak();
  var ctaLabel = todayDone ? (ic('leaf',15)+'今天已完成，可补充') : (ic('check',15)+'记今天的复盘');
  return '<div class="card wide rv-hero">'+
    '<div class="rv-hero-strip">'+seg+'</div>'+
    '<div class="rv-hero-foot">'+
      '<div class="rv-stat"><span class="rv-stat-n">'+doneCnt+'<span class="rv-stat-d">/7</span></span><span class="rv-stat-l">本周已回顾</span></div>'+
      '<div class="rv-stat"><span class="rv-stat-n">'+streak+'<span class="rv-stat-d">天</span></span><span class="rv-stat-l">连续复盘 '+ic('fire',12)+'</span></div>'+
      '<button class="btn pri rv-cta" data-act="rc-goto-today">'+ctaLabel+'</button>'+
    '</div>'+
    '<div class="rv-hero-cap tiny muted">每天记三件事 + 一句复盘，七天连成一周的成长 🌱</div>'+
  '</div>';
}

function dayCardHTML(dt, T){
  var d = dayState(dt);
  var isToday = dt === T, isFuture = diffDays(dt,T) > 0, done = d.done;
  var mitDone = d.mit.filter(function(x){ return x.done && x.text.trim(); }).length;
  var mitFill = d.mit.filter(function(x){ return x.text.trim(); }).length;

  var status;
  if(isFuture) status = '<span class="chip" style="font-size:10px;background:var(--bg2)">未来</span>';
  else if(done) status = '<span class="chip gr" style="font-size:10px">已回顾 ✓</span>';
  else if(mitFill>0 || (d.goods&&d.goods.trim()) || (d.tomorrow&&d.tomorrow.trim())) status = '<span class="chip" style="font-size:10px;background:var(--bg2)">有内容</span>';
  else status = '<span class="chip" style="font-size:10px;background:var(--bg2)">未填写</span>';

  var pdots = '';
  for(var k=0;k<3;k++){ pdots += '<span class="pdot'+(k<mitDone?' on':'')+'"></span>'; }

  var body, foot='', more='';
  if(isFuture){
    body = '<div class="dc-future tiny muted">'+ic('sun',14)+' 这是未来的日子，到时候再来记～</div>';
  } else {
    var open = RC_OPEN[dt] !== undefined ? RC_OPEN[dt] : isToday;
    var rows = d.mit.map(function(it, idx){
      return '<div class="mit-row'+(it.done?' done':'')+'">'+
        '<button class="mitchk'+(it.done?' on':'')+'" data-act="mit-done" data-d="'+dt+'" data-i="'+idx+'" aria-label="标记完成">'+ic('check',12)+'</button>'+
        '<input class="inp mit-inp" type="text" placeholder="第 '+(idx+1)+' 件最重要的事…" value="'+esc(it.text)+'" data-act="mit-text" data-d="'+dt+'" data-i="'+idx+'" maxlength="60">'+
        (it.text.trim() ? '<button class="mitclear" data-act="mit-clear" data-d="'+dt+'" data-i="'+idx+'" aria-label="清空">'+ic('x',12)+'</button>' : '<span class="mitclear-ph"></span>')+
      '</div>';
    }).join('');
    body = '<div class="mitlist">'+rows+'</div>';
    var doneBtn = '<button class="dc-done'+(done?' on':'')+'" data-act="rc-done" data-d="'+dt+'">'+(done?ic('check',13)+'已回顾，点此撤销':ic('check',13)+'完成今日回顾')+'</button>';
    more = '<div class="dc-more" style="display:'+(open?'block':'none')+'">'+
      '<div class="dc-field"><div class="dc-field-h">'+ic('star',13)+'今天值得记住的 3 件好事<span class="muted2">（哪怕很小）</span></div>'+
        '<textarea class="inp daily-ta" rows="2" placeholder="例如：没赖床、读完最难那篇、和朋友聊得开心…" data-act="daily-goods" data-d="'+dt+'">'+esc(d.goods)+'</textarea>'+
      '</div>'+
      '<div class="dc-field"><div class="dc-field-h">'+ic('bolt',13)+'明天最想改进 / 专注的一件事</div>'+
        '<textarea class="inp daily-ta" rows="2" placeholder="只写一件，明天就盯着它。" data-act="daily-tomorrow" data-d="'+dt+'">'+esc(d.tomorrow)+'</textarea>'+
      '</div>'+
    '</div>';
    foot = '<div class="dc-foot">'+doneBtn+'<button class="dc-more-btn" data-act="rwd-toggle" data-d="'+dt+'">'+(open?'收起 ✎':'更多 ✎')+'</button></div>';
  }

  return '<div class="daycard'+(done?' done':'')+(isToday?' today':'')+(isFuture?' future':'')+'" id="day-'+dt+'">'+
    '<div class="dc-head" data-act="rwd-toggle" data-d="'+dt+'" style="cursor:pointer">'+
      '<div class="dc-date"><span class="dc-md">'+md(dt).slice(5)+'</span><span class="dc-wd">周'+wdOf(dt)+'</span>'+status+'</div>'+
      '<div class="dc-prog">'+pdots+(!isFuture?'<span class="dc-prog-tx tiny muted">'+mitDone+'/3</span>':'')+'</div>'+
    '</div>'+
    body + foot + more +
  '</div>';
}

  return '<div class="four">'+
    fbox('keep','保持 ✅','这周哪件事做对了，下周继续',notes.keep,cw)+

function renderHeatmap(){

  for(var w=0; w<53; w++){

      if(diffDays(dt, T) > 0){ col += '<span class="hm-cell empty"></span>'; }
      else {
        var d = D[dt], lvl = 0;

          var mdn = d.mit.filter(function(x){return x.done && x.text.trim();}).length;

/* 每日回顾日志（读 days 映射，返回有记录的日期列表） */
function reviewLog(){
  var D = S.settings.days || {};
  return Object.keys(D).filter(function(k){ var d=D[k]; return d && (d.done || (d.mit&&d.mit.some(function(x){ return x.text&&x.text.trim(); })) || (d.goods&&d.goods.trim()) || (d.tomorrow&&d.tomorrow.trim())); })
    .sort(function(a,b){ return a<b?1:(a>b?-1:0); })

  var weeks = {};

/* 近 14 天投入时长 · 分目标堆叠柱状图（手写 SVG） */
function isTimeUnit(unit){ return /小时|小时|minute|hour|分/i.test(unit||''); }
function recordMinutes(r){
  var min = 0;
  if(r.minutes && r.minutes > 0) min += r.minutes;
  if(!min){
    var g = goalById(r.goalId);
    if(g && /小时/.test(g.unit)) min = (r.amount||0) * 60;
    else if(g && /分钟|分/.test(g.unit) && !/篇|个|页|节|次|天|词|字|本/.test(g.unit)) min = (r.amount||0);
  }
  return min;
}
function minutesChart(){
  var T = todayStr(), days = [], i;
  for(i=13;i>=0;i--) days.push(addDays(T,-i));
  var goals = S.goals;
  var data = {}, noMin = 0, anyMin = 0;
  days.forEach(function(d){ data[d] = {}; });
  S.records.forEach(function(r){
    if(diffDays(days[0], r.date) < 0 || diffDays(r.date, T) < 0) return;
    var min = recordMinutes(r);
    if(min <= 0){ noMin++; return; }
    data[r.date][r.goalId] = (data[r.date][r.goalId] || 0) + min;
    anyMin += min;
  });
  if(anyMin === 0){
    return '<div class="empty" style="padding:26px 12px"><div class="ei">'+ic('chart',24)+'</div><b>近 14 天还没有时长数据</b><p>打卡时填了「分钟」，或者目标单位是「小时」，这里就会长出柱子。<br>没填的记录不会被硬凑成数字。</p></div>';
  }
  var totals = days.map(function(d){ var s=0; goals.forEach(function(g){ s += data[d][g.id]||0; }); return s; });
  var max = Math.max.apply(null, totals);
  var step = max <= 60 ? 15 : max <= 150 ? 30 : max <= 300 ? 60 : 120;
  var top = Math.ceil(max/step)*step || step;

  var mobile = window.innerWidth <= 600;
  var W = mobile ? 500 : 720, H = mobile ? 240 : 250, L = mobile ? 32 : 42, R = mobile ? 8 : 12, TOP = 14, B = mobile ? 44 : 40;
  var pw = W - L - R, ph = H - TOP - B;
  var bw = Math.min(mobile ? 22 : 30, (pw/14) * 0.6);
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="auto" style="min-width:'+(mobile?W+'px':'560px')+';display:block" role="img" aria-label="近 14 天投入分钟堆叠柱状图">';
  // 网格
  for(i=0;i<=top/step;i++){
    var v = i*step, y = TOP + ph - (v/top)*ph;
    svg += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="'+(i===0?'#dde2f1':'#f0f2fa')+'" stroke-width="1"/>';
    svg += '<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#9aa0b8">'+v+'</text>';
  }
  svg += '<text x="'+L+'" y="'+(TOP-3)+'" font-size="10.5" fill="#9aa0b8">分钟</text>';
  // 柱
  days.forEach(function(d, idx){
    var cx = L + (pw/14)*(idx+0.5);
    var acc = 0;
    goals.forEach(function(g){
      var v = data[d][g.id] || 0;
      if(!v) return;
      var h = (v/top)*ph;
      var y = TOP + ph - acc - h;
      acc += h;
      svg += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1.5,h).toFixed(1)+'" fill="'+g.color+'" rx="2"><title>'+esc(md(d))+' · '+esc(g.name)+'：'+fmtMin(v)+'</title></rect>';
    });
    if(totals[idx] > 0){
      svg += '<text x="'+cx.toFixed(1)+'" y="'+(TOP+ph-acc-5).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#3a3f57">'+fmtMin(totals[idx])+'</text>';
    }
    svg += '<text x="'+cx.toFixed(1)+'" y="'+(TOP+ph+15)+'" text-anchor="middle" font-size="10" fill="'+(d===T?'#7c5cff':'#9aa0b8')+'" font-weight="'+(d===T?'800':'500')+'">'+mdShort(d)+'</text>';
    svg += '<text x="'+cx.toFixed(1)+'" y="'+(TOP+ph+28)+'" text-anchor="middle" font-size="9.5" fill="#c2c7da">'+wdOf(d)+'</text>';
  });
  svg += '</svg>';

  var legend = '<div class="legend">'+goals.map(function(g){
    var s = days.reduce(function(a,d){ return a + (data[d][g.id]||0); }, 0);
    return '<span><i style="background:'+g.color+'"></i>'+esc(g.name)+' <b class="mono">'+fmtMin(s)+'</b></span>';
  }).join('')+'</div>';
  var note = noMin ? '<div class="tiny muted" style="margin-top:8px">'+ic('info',12,' style="display:inline;vertical-align:-2px"')+' 另有 '+noMin+' 条记录没有时长数据，未计入图表。</div>' : '';
  return '<div class="chartbox">'+svg+'</div>'+legend+note;
}

function calMonthKey(){
  return S.settings.calMonth || todayStr().slice(0,7);
}
function shiftCalMonth(delta){
  var ym = calMonthKey();
  var y = Number(ym.slice(0,4)), m = Number(ym.slice(5,7)) + delta;
  if(m < 1){ m = 12; y--; }
  if(m > 12){ m = 1; y++; }
  return y + '-' + (m<10?'0'+m:m);
}
function renderCalendar(){
  var ym = calMonthKey();
  var y = Number(ym.slice(0,4)), m = Number(ym.slice(5,7));
  var startDow = (new Date(y, m-1, 1).getDay() + 6) % 7;   /* 周一=0 */
  var daysInMonth = new Date(y, m, 0).getDate();
  var dayGoals = {};
  S.records.forEach(function(r){
    if(!r.date) return;
    (dayGoals[r.date] = dayGoals[r.date] || []);
    if(dayGoals[r.date].indexOf(r.goalId) < 0) dayGoals[r.date].push(r.goalId);
  });
  var html = '<div class="cal-bar">'+
    '<button class="btn sm ghost" data-act="cal-prev">'+ic('left',15)+'</button>'+
    '<div class="cal-title">'+y+' 年 '+m+' 月</div>'+
    '<button class="btn sm ghost" data-act="cal-next">'+ic('right',15)+'</button>'+
    '</div>';
  html += '<div class="cal-week">'+['一','二','三','四','五','六','日'].map(function(w){ return '<span>'+w+'</span>'; }).join('')+'</div>';
  html += '<div class="cal-grid">';
  for(var i=0;i<startDow;i++) html += '<div class="cal-cell empty"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var date = ym + '-' + (d<10 ? '0'+d : d);
    var gids = dayGoals[date] || [];
    var dots = gids.slice(0,6).map(function(gid){
      var g = goalById(gid);
      return '<span class="cal-dot" style="background:'+(g?g.color:'#ccc')+'" title="'+esc(g?g.name:'')+'"></span>';
    }).join('');
    var more = gids.length > 6 ? '<span class="cal-more">+'+(gids.length-6)+'</span>' : '';
    var isToday = date === todayStr();
    html += '<div class="cal-cell'+(isToday?' today':'')+(gids.length?' has':'')+'" data-act="cal-day" data-date="'+date+'">'+
      '<span class="cal-num">'+d+'</span>'+
      (gids.length ? '<span class="cal-dots">'+dots+more+'</span>' : '')+
      '</div>';
  }
  html += '</div>';
  html += '<div class="tiny muted" style="margin-top:10px">每个色点 = 当天打卡的一个目标（含已完成），点日期看详情。</div>';
  return html;
}

/* ---------------------------- 10. 周报 ---------------------------- */
function weekAgg(ws){
  var we = addDays(ws,6);
  var per = {}, days = {}, tot = { amount:0, minutes:0 };
  S.goals.forEach(function(g){ per[g.id] = { amount:0, minutes:0, days:{} }; });
  S.records.forEach(function(r){
    if(diffDays(ws, r.date) < 0 || diffDays(r.date, we) < 0) return;
    if(!per[r.goalId]) return;
    per[r.goalId].amount += r.amount;
    per[r.goalId].minutes += (r.minutes || 0);
    per[r.goalId].days[r.date] = 1;
    days[r.date] = 1;
    tot.amount += r.amount; tot.minutes += (r.minutes || 0);
  });
  return { ws:ws, we:we, per:per, totalDays:Object.keys(days).length, tot:tot };
}
function deltaHTML(cur, prev, unit){
  var d = cur - prev;
  if(Math.abs(d) < 0.05) return '<span class="delta eq">与上周持平</span>';
  var cls = d > 0 ? 'up' : 'dn';
  var sign = d > 0 ? '+' : '−';
  var pctTxt = prev > 0 ? '（'+(d>0?'+':'−')+Math.round(Math.abs(d)/prev*100)+'%）' : '（上周为 0）';
  return '<span class="delta '+cls+'">'+sign+n1(Math.abs(d))+(unit||'')+' '+pctTxt+'</span>';
}
function deltaText(cur, prev, unit){
  var d = cur - prev;
  if(Math.abs(d) < 0.05) return '持平';
  return (d>0?'+':'-')+n1(Math.abs(d))+(unit||'')+(prev>0 ? '（'+(d>0?'+':'-')+Math.round(Math.abs(d)/prev*100)+'%）' : '（上周为 0）');
}

function buildReport(){
  var cw = S.settings.week || weekStartOf(todayStr());
  var a = weekAgg(cw), b = weekAgg(addDays(cw,-7));
  var notes = S.weekly[cw] || {};
  var L = [];
  L.push('【学习周报】'+a.ws+' ~ '+a.we);
  L.push('');
  L.push('一、本周投入（括号内为对比上周）');
  var any = false;
  S.goals.forEach(function(g){
    var x = a.per[g.id], y = b.per[g.id];
    if(!x || (x.amount === 0 && (!y || y.amount === 0))) return;
    any = true;
    var xd = Object.keys(x.days).length, yd = y ? Object.keys(y.days).length : 0;
    var seg = '· '+g.name+'：'+n1(x.amount)+' '+g.unit+'（'+deltaText(x.amount, y?y.amount:0, ' '+g.unit)+'）｜打卡 '+xd+' 天（'+deltaText(xd, yd, ' 天')+'）';
    if(x.minutes || (y && y.minutes)) seg += '｜'+fmtMin(x.minutes)+'（'+deltaText(x.minutes, y?y.minutes:0, ' 分')+'）';
    var c = computeGoal(g);
    var ft = forecastText(c);
    seg += '\n    进度 '+n1(c.done)+'/'+n1(g.total)+' '+g.unit+'（'+(c.pct*100).toFixed(1)+'%），预计完成：'+ft.main+(ft.sub?('，'+ft.sub):'');
    L.push(seg);
  });
  if(!any) L.push('· 本周没有任何打卡记录。');
  L.push('');
  L.push('合计：有效打卡 '+a.totalDays+'/7 天（'+deltaText(a.totalDays, b.totalDays, ' 天')+'）'+((a.tot.minutes||b.tot.minutes)?('，投入 '+fmtMin(a.tot.minutes)+'（'+deltaText(a.tot.minutes,b.tot.minutes,' 分')+'）'):''));
  L.push('');
  L.push('二、保持');
  L.push(notes.keep ? notes.keep : '（未填写）');
  L.push('');
  L.push('三、问题');
  L.push(notes.issue ? notes.issue : '（未填写）');
  L.push('');
  L.push('四、尝试');
  L.push(notes.try ? notes.try : '（未填写）');
  L.push('');
  L.push('五、下周预案');
  L.push(notes.plan ? notes.plan : '（未填写）');
  L.push('');
  L.push('六、本周记录明细（时间 / 任务量 / 内容）');
  var wr = S.records.filter(function(r){ return diffDays(a.ws, r.date) >= 0 && diffDays(r.date, a.we) >= 0; })
    .sort(function(x,y){ return x.date < y.date ? 1 : (x.date > y.date ? -1 : 0); });
  if(wr.length){
    wr.forEach(function(r){
      var gg = S.goals.filter(function(x){ return x.id===r.goalId; })[0];
      L.push('· '+r.date+' ｜ '+(gg?gg.name:'?')+'：+'+n1(r.amount)+(gg?(' '+gg.unit):'')+(r.minutes?('，'+fmtMin(r.minutes)):(recordMinutes(r)?('，'+fmtMin(recordMinutes(r))):''))+(r.content?(' ｜ '+r.content):''));
    });
  } else { L.push('（无）'); }
  return L.join('\n');
}

/* ---------------------------- 13. 打卡 ---------------------------- */
function doPunch(gid){
  var g = S.goals.filter(function(x){ return x.id===gid; })[0];
  if(!g) return;
  var c = computeGoal(g);
  var wasComplete = c.complete;
  var d = (S.settings.punch && S.settings.punch[gid]) || {};
  if(g.isFruit) d.amount = 1;   /* 水果饮食：每次打卡固定记 1 次 */
  var amtRaw = d.amount != null && d.amount !== '' ? d.amount : (c.complete ? '' : n1(c.suggest));
  var amt = Number(amtRaw);
  if(!isFinite(amt) || amt <= 0){ toast('填一个大于 0 的完成量'); var el=$('#pa-'+gid); if(el) el.focus(); return; }
  var min = d.minutes;
  min = (min === '' || min == null) ? null : Number(min);
  if(min != null && (!isFinite(min) || min <= 0)) min = null;
  var date = d.date || todayStr();
  if(diffDays(date, todayStr()) < 0) date = todayStr();   /* 只拦未来日期，不限制回补天数 */
  var isBack = date !== todayStr();

  var cnt = (d.content != null ? String(d.content) : '').trim().slice(0,300);
  var bookId = (g.useBooks ? (d.bookId || null) : null);   /* 读书目标按选书归类 */
  if(g.useBooks && (!bookId || bookId === '__new__' || !bookById(g, bookId))){ toast('选一个进行中的内容'); return; }
  S.records.push({ id:uid(), goalId:gid, date:date, amount:Math.round(amt*100)/100, minutes:min, content:cnt, backfill:isBack, createdAt:nowLocal(), bookId:bookId });
  if(S.settings.punch) delete S.settings.punch[gid];
  save();

  var c2 = computeGoal(g);
  if(!wasComplete && c2.complete){
    g.doneCelebrated = true; save();
    setTimeout(confetti, 180);
    toast('『'+g.name+'』完成了，全部拿下！');
  }else{
    toast((isBack ? '已补记到 '+md(date)+'：+' : '打卡成功：+')+n1(amt)+' '+g.unit+(min?('，'+min+' 分钟'):'')+'，连续 '+c2.streak.streak+' 天');
  }
  S._justPunched = true;   /* 触发「今天要处理」聚焦卡的更新高亮 */
  renderAll();
}

/* 打开时把内嵌的最新 INTEL_ITEMS 同步进情报目标：按标题保留已读状态、刷新总数。
   这样每月 1 号重新部署新清单后，用户下次打开即自动更新（数据仍在本地）。 */
function syncIntelItems(){
  if(!S || !S.goals || !INTEL_ITEMS || !INTEL_ITEMS.length) return;
  var g = S.goals.filter(function(x){ return x.isIntel; })[0];
  if(!g) return;
  var readTitles = {};
  (g.items||[]).forEach(function(it){ if(it.read) readTitles[it.title] = 1; });
  var recTitles = {};
  recsOf(g.id).forEach(function(r){ if(r.content) recTitles[r.content] = 1; });
  g.items = INTEL_ITEMS.map(function(c){
    var title = c.t;
    return { id: uid(), title:title, source:c.s, url:c.u, date:c.d, heat:c.h, reason:c.r, cat:c.c,
      read: !!(readTitles[title] || recTitles[title]) };
  });
  g.total = g.items.length;
  g.unit = '篇';
}

/* ---------------------------- 13.6 情报清单外部化：运行时拉取 ----------------------------
   intel.json 与页面同目录部署；改这个 JSON 即更新情报，无需重新部署、链接不变。
   INTEL_SOURCE 可改为固定 URL（如 GitHub Gist raw / CDN），实现「代码链接固定、情报按月更新」。
   fetch 失败或 JSON 不合法时静默回退到内置 INTEL_ITEMS，页面不空。 */
var INTEL_SOURCE = 'intel.json';
function mapIntel(list){
  return list.map(function(c){
    return { t:String(c.title||c.t||'').slice(0,120), s:String(c.source||c.s||'').slice(0,30),
      u:String(c.url||c.u||'').slice(0,400), d:(/^\d{4}-\d{2}-\d{2}$/.test(String(c.date||c.d||''))?String(c.date||c.d):''),
      h:Number(c.heat!=null?c.heat:c.h)||0, r:String(c.reason||c.r||'').slice(0,140), c:String(c.cat||c.c||'').slice(0,20) };
  }).filter(function(c){ return c.t; });
}
function loadIntel(){
  if(!INTEL_SOURCE) return;
  if(typeof fetch !== 'function') return;
  fetch(INTEL_SOURCE, { cache:'no-cache' })
    .then(function(resp){ if(!resp.ok) throw new Error('HTTP '+resp.status); return resp.json(); })
    .then(function(json){
      var list = Array.isArray(json) ? json : (json && json.items);
      if(!Array.isArray(list) || !list.length) throw new Error('empty list');
      var mapped = mapIntel(list);
      if(!mapped.length) throw new Error('no valid items');
      INTEL_ITEMS = mapped;
      syncIntelItems();
      save();
      renderAll();
    })
    .catch(function(e){ console.warn('[intel] 远程清单加载失败，沿用内置清单：', e); });
}

function _v(x,y){ return { x:x, y:y }; }
function _norm(v){ var m=Math.hypot(v.x,v.y)||1; return _v(v.x/m, v.y/m); }
function _rot(v, ang, r){ var n=_norm(v), ca=Math.cos(ang), sa=Math.sin(ang); return _v((n.x*ca-n.y*sa)*r, (n.x*sa+n.y*ca)*r); }
function _add(a,b){ return _v(a.x+b.x, a.y+b.y); }

/* ---------- 成长地图：单张可缩放星图 + 高亮支线 ---------- */
function focusPath(focus){
  if(focus==='center') return [{ label:'我的成长', focus:'center' }];
  if(focus.indexOf('dir:')===0){ return [{ label:'我的成长', focus:'center' }, { label:dirById(focus.slice(4)).name, focus:focus }]; }
  var chain=[], cur=focus, guard=0;
  while(cur && cur.indexOf('node:')===0 && guard++<30){
    var n=nodeOf(cur.slice(5)); if(!n) break;
    chain.unshift({ label:n.name, focus:cur });
    cur = n.parent ? ('node:'+n.parent) : ('dir:'+n.dirId);
  }
  if(cur && cur.indexOf('dir:')===0) chain.unshift({ label:dirById(cur.slice(4)).name, focus:cur });
  chain.unshift({ label:'我的成长', focus:'center' });
  return chain;
}
/* 一次性构建整张树：中心 + 4 方向 + 各方向顶层节点 + 递归子节点 */
var NODE_ICON_POOL = ['target','flag','fire','bolt','chart','note','book','layers','map','globe','circle','filter','star','gem','mountain','compass','flower','rocket','spark','shield'];
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return Math.abs(h); }
function pickNodeIcon(nodeId, dirId){
  var dc = dirById(dirId);
  var seed = hashStr(nodeId+'|'+dirId+'|'+dc.icon);
  return NODE_ICON_POOL[seed % NODE_ICON_POOL.length];
}
function buildFullMap(){
  var cx=0.5, cy=0.5;
  var items=[];  // {id, name, kind, x, y, dirId, status, parentId, depth, color, soft, icon, hasChild, childCount, rawId}
  var lines=[];  // {id, from, to, color, w}
  items.push({ id:'__center', name:'我的成长', kind:'center', x:cx, y:cy, depth:0, parentId:null });
  var dirAngles = [-Math.PI/2, 0, Math.PI/2, Math.PI];
  DIRECTIONS.forEach(function(d, di){
    var ang = dirAngles[di];
    var dx = cx + Math.cos(ang) * 0.20;
    var dy = cy + Math.sin(ang) * 0.20;
    var did = 'dir:'+d.id;
    items.push({ id:did, name:d.name, kind:'dir', x:dx, y:dy, dirId:d.id, parentId:'__center', depth:1, color:d.color, soft:d.soft, icon:d.icon });
    lines.push({ id:'L:'+did, from:'__center', to:did, color:d.color, w:2.4 });
    var tops = topNodesOf(d.id);
    layoutChildren(tops, did, dx, dy, ang, 0.13, 2, true);
  });
  function layoutChildren(list, parentId, px, py, parentAng, baseR, depth, isRootDir){
    var n = list.length; if (!n) return;
    var spread;
    if (depth === 2) spread = isRootDir ? Math.PI*0.7 : Math.PI/3;
    else if (depth === 3) spread = Math.PI/3.5;
    else spread = Math.PI/4.5;
    list.forEach(function(child, i){
      var off = n === 1 ? 0 : (i - (n-1)/2) * (spread / Math.max(n-1, 1));
      var ang = parentAng + off;
      var cx2 = px + Math.cos(ang) * baseR;
      var cy2 = py + Math.sin(ang) * baseR;
      var cid = 'node:'+child.id;
      var dc = dirById(child.dirId);
      var subs = childrenOf(child.id);
      var icon = pickNodeIcon(child.id, child.dirId);
      items.push({
        id:cid, name:child.name, kind:'node', x:cx2, y:cy2,
        dirId:child.dirId, status:child.status, parentId:parentId,
        depth:depth, color:dc.color, soft:dc.soft, icon:icon,
        hasChild: subs.length > 0, childCount: subs.length,
        rawId: child.id
      });
      lines.push({ id:'L:'+cid, from:parentId, to:cid, color:dc.color, w:1.5 });
      if (subs.length && depth < 6) {
        layoutChildren(subs, cid, cx2, cy2, ang, baseR * 0.78, depth + 1, false);
      }
    });
  }
  return { items:items, lines:lines };
}
/* 缩放状态 */
var mapZoom = 1, mapPanX = 0, mapPanY = 0;
var mapHighlightMid = null;
var mapItemsIndex = {};
var mapPanSuppressClick = false;
function applyMapTransform(){

function zoomMap(factor, cx, cy){
  var newZoom = clamp(mapZoom * factor, 0.5, 3);
  if (cx === undefined) {
    var cv = $('#map-canvas');
    if (cv) {
      var r = cv.getBoundingClientRect();
      cx = r.width / 2; cy = r.height / 2;
    } else { cx = 0; cy = 0; }
  }
  mapPanX = cx - (cx - mapPanX) * (newZoom / mapZoom);
  mapPanY = cy - (cy - mapPanY) * (newZoom / mapZoom);
  mapZoom = newZoom;
  applyMapTransform();
}
function resetMapView(){
  mapZoom = 1; mapPanX = 0; mapPanY = 0; mapHighlightMid = null;

}
function highlightMap(mid){
  if (mid === mapHighlightMid) { resetMapView(); return; }
  mapHighlightMid = mid;
  var items = $$('#map-canvas .map-item');
  var lines = $$('#map-canvas .map-line');
  var actionBar = $('#map-action-bar');
  // 先移除所有节点的 selected 类
  items.forEach(function(el){ el.classList.remove('selected'); });
  // 隐藏浮动操作栏
  if (actionBar) { actionBar.classList.remove('show'); actionBar.innerHTML = ''; }
  if (!mid) {
    items.forEach(function(el){ el.classList.remove('active','dim'); });
    lines.forEach(function(el){ el.classList.remove('active','dim'); });
    return;
  }
  var chain = [];
  var cur = mid, guard = 0;
  while (cur && cur !== '__center' && guard++ < 30) {
    chain.push(cur);
    var it = mapItemsIndex[cur];
    cur = it ? it.parentId : null;
  }
  chain.push('__center');
  var directChildren = [];
  Object.keys(mapItemsIndex).forEach(function(k){
    if (mapItemsIndex[k].parentId === mid && k !== '__center') directChildren.push(k);
  });
  var highlightSet = {};
  chain.forEach(function(id){ highlightSet[id] = 1; });
  directChildren.forEach(function(id){ highlightSet[id] = 2; });
  var lineHighlightSet = {};
  for (var i = 0; i < chain.length - 1; i++) {
    lineHighlightSet['L:'+chain[i]] = 1;
  }
  directChildren.forEach(function(id){ lineHighlightSet['L:'+id] = 1; });
  items.forEach(function(el){
    var k = el.getAttribute('data-mid');
    if (highlightSet[k]) {
      el.classList.add('active');
      el.classList.remove('dim');
    } else {
      el.classList.remove('active');
      el.classList.add('dim');
    }
    // 给用户直接点击的节点添加 selected 类
    if (k === mid) {
      el.classList.add('selected');
    }
  });
  lines.forEach(function(el){
    var k = el.getAttribute('data-line');
    if (lineHighlightSet[k]) {
      el.classList.add('active');
      el.classList.remove('dim');
    } else {
      el.classList.remove('active');
      el.classList.add('dim');
    }
  });
  // 显示浮动操作栏（直接挂在 map-canvas 下，不受节点层叠上下文影响）
  var nodeInfo = mapItemsIndex[mid];
  if (actionBar && nodeInfo) {
    var barHtml = '';
    if (nodeInfo.kind === 'node' && nodeInfo.rawId) {
      barHtml = '<span class="mab-label">'+esc(nodeInfo.name)+'</span>'+
        '<button class="mab-btn det" data-act="map-node" data-id="'+nodeInfo.rawId+'" aria-label="查看详情">'+ic('right',16)+'</button>'+

function renderMapComposite(){
  var data = buildFullMap();
  var xs = data.items.map(function(it){ return it.x; });
  var ys = data.items.map(function(it){ return it.y; });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  var pad = 0.09;
  var spanX = maxX - minX, spanY = maxY - minY;
  if (spanX < 1e-6) spanX = 1;
  if (spanY < 1e-6) spanY = 1;
  data.items.forEach(function(it){
    it.x = (it.x - minX) / spanX * (1 - 2 * pad) + pad;
    it.y = (it.y - minY) / spanY * (1 - 2 * pad) + pad;
  });
  mapItemsIndex = {};
  data.items.forEach(function(it){ mapItemsIndex[it.id] = it; });
  var svg = '<svg class="map-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">';
  svg += '<defs><filter id="wobble" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="n" seed="7"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>';
  data.lines.forEach(function(L){
    var from = mapItemsIndex[L.from], to = mapItemsIndex[L.to];
    if (!from || !to) return;
    var dx = (to.x - from.x), dy = (to.y - from.y);
    var len = Math.sqrt(dx*dx + dy*dy);
    var nx = len > 1e-6 ? -dy / len : 0;
    var ny = len > 1e-6 ? dx / len : 0;
    var bend = len * 0.18;
    var mx = (from.x + to.x) / 2 * 1000 + nx * bend * 1000;
    var my = (from.y + to.y) / 2 * 1000 + ny * bend * 1000;
    var x1 = from.x * 1000, y1 = from.y * 1000;
    var x2 = to.x * 1000, y2 = to.y * 1000;
    var lx1 = x1 + (mx - x1) * 0.35, ly1 = y1 + (my - y1) * 0.35;
    var lx2 = x2 + (mx - x2) * 0.35, ly2 = y2 + (my - y2) * 0.35;
    svg += '<path class="map-path-edge" data-line="'+L.to+'" d="M '+x1+' '+y1+' C '+lx1+' '+ly1+' '+lx2+' '+ly2+' '+x2+' '+y2+'" stroke="'+L.color+'" stroke-width="5" stroke-opacity="0.45" fill="none" stroke-linecap="round" stroke-dasharray="2 9" filter="url(#wobble)"/>';
    svg += '<path class="map-path-fill" data-line="'+L.to+'" d="M '+x1+' '+y1+' C '+lx1+' '+ly1+' '+lx2+' '+ly2+' '+x2+' '+y2+'" stroke="'+L.color+'" stroke-width="2.4" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>';
  });
  svg += '</svg>';
  var ov = '';
  data.items.forEach(function(it){
    var style = 'left:'+(it.x*100)+'%;top:'+(it.y*100)+'%;';
    var stColor = (it.status !== undefined && ST_COLOR[it.status]) || '#b9b7a8';
    if (it.kind === 'center') {
      ov += '<div class="map-item map-center" data-mid="'+it.id+'" style="'+style+'">'+
        '<div class="map-icon-circle center">'+ic('leaf',26)+'</div>'+
        '<div class="map-name">'+esc(it.name)+'</div>'+
        characterSVG()+
      '</div>';
    } else if (it.kind === 'dir') {
      ov += '<div class="map-item map-dir" data-mid="'+it.id+'" data-act="map-highlight" data-id="'+it.id+'" style="'+style+'">'+
        '<div class="map-icon-circle dir" style="background:'+it.color+';border-color:'+it.color+'">'+ic(it.icon,26)+'</div>'+
        '<div class="map-name">'+esc(it.name)+'</div>'+
        '<button class="map-action-btn add" data-act="add-node" data-dir="'+it.dirId+'" aria-label="添加节点">'+ic('plus',14)+'</button>'+
      '</div>';
    } else {
      ov += '<div class="map-item map-node" data-mid="'+it.id+'" data-act="map-highlight" data-id="'+it.id+'" style="'+style+'">'+
        '<div class="map-icon-circle node" style="background:'+it.soft+';border-color:'+it.color+'">'+
          ic(it.icon, 22)+
          '<span class="map-status-dot" style="background:'+stColor+'"></span>'+
        '</div>'+
        '<div class="map-name">'+esc(it.name)+'</div>'+
        (it.hasChild ? '<span class="map-child-badge">'+it.childCount+'</span>' : '')+
        '<div class="map-item-actions">'+
          '<button class="map-action-btn det" data-act="map-node" data-id="'+it.rawId+'" aria-label="查看详情">'+ic('right',14)+'</button>'+
          '<button class="map-action-btn add" data-act="add-subnode" data-id="'+it.rawId+'" aria-label="添加子节点">'+ic('plus',14)+'</button>'+
          '<button class="map-action-btn del" data-act="edit-node" data-id="'+it.rawId+'" aria-label="编辑">'+ic('edit',14)+'</button>'+
          '<button class="map-action-btn del" data-act="del-node" data-id="'+it.rawId+'" aria-label="删除">'+ic('trash',14)+'</button>'+
        '</div>'+
      '</div>';
    }
  });
  var ratio = (spanX / spanY);
  if (ratio > 1.3) ratio = 1.3;
  if (ratio < 0.75) ratio = 0.75;
  var ratioStr = ratio.toFixed(3);
  var cat='<svg class="mapcat" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 38c-2 0-4-1-4-3 0-2 1-3 2-4-1-2-2-5-2-8 0-7 5-12 11-13 1-3 3-6 5-8 2 2 3 5 3 8 3 1 5 4 5 7 0 1 0 2 0 3 2 1 4 3 4 6 0 5-4 8-8 9-1 0-2 0-3 0 0 2-1 4-2 5-1 2-3 2-5 2-2 0-4-1-4-3 0-1 0-2 1-2z" fill="#2a2620"/></svg>';
  return '<div class="map-canvas" id="map-canvas" style="aspect-ratio:'+ratioStr+'">'+
    '<div class="map-viewport" id="map-viewport">'+
      '<div class="map-stage" id="map-stage">'+
        '<div class="map-svg-wrap">'+svg+'</div>'+
        '<div class="map-overlay">'+ov+'</div>'+
      '</div>'+
    '</div>'+
    '<button class="map-back-btn" data-act="map-home" aria-label="返回中心">'+ic('left',18)+'</button>'+
    '<div class="map-zoom-ctrl">'+
      '<button data-act="map-zoom-in" aria-label="放大">'+ic('plus',16)+'</button>'+
      '<button data-act="map-zoom-out" aria-label="缩小">'+ic('minus',16)+'</button>'+
      '<button data-act="map-zoom-reset" aria-label="还原">'+ic('target',14)+'</button>'+
    '</div>'+
    '<div class="map-action-bar" id="map-action-bar"></div>'+
    cat+
  '</div>';
}
function initMapInteraction(){
  var cv = $('#map-canvas');
  if (!cv) return;
  if (!cv.__mapInit) {
    cv.__mapInit = true;
    cv.addEventListener('wheel', function(e){
      e.preventDefault();
      var r = cv.getBoundingClientRect();
      var mx = e.clientX - r.left, my = e.clientY - r.top;
      var factor = e.deltaY < 0 ? 1.12 : 0.89;
      zoomMap(factor, mx, my);
    }, { passive: false });

    var mode = null;
    var lastDist = 0, lastCX = 0, lastCY = 0;
    var lastTX1 = 0, lastTY1 = 0;

    var longPressTimer = null;
    var longPressStartX = 0, longPressStartY = 0;
    var longPressMoved = false;
    var singlePanActive = false;
    var singleLastX = 0, singleLastY = 0;
    var LONG_PRESS_MS = 280;
    var LONG_PRESS_MOVE_PX = 8;

    cv.addEventListener('touchstart', function(e){
      if (e.touches.length === 2) {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        singlePanActive = false;
        e.preventDefault();
        var t0 = e.touches[0], t1 = e.touches[1];
        lastDist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        var r = cv.getBoundingClientRect();
        lastCX = (t0.clientX + t1.clientX)/2 - r.left;
        lastCY = (t0.clientY + t1.clientY)/2 - r.top;
        lastTX1 = t0.clientX; lastTY1 = t0.clientY;
        mode = null;
      } else if (e.touches.length === 1) {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        var t = e.touches[0];
        longPressStartX = t.clientX;
        longPressStartY = t.clientY;
        longPressMoved = false;
        singlePanActive = false;
        longPressTimer = setTimeout(function(){
          if (!longPressMoved) {
            singlePanActive = true;
            singleLastX = t.clientX;
            singleLastY = t.clientY;
            if (navigator.vibrate) { navigator.vibrate(15); }
          }
        }, LONG_PRESS_MS);
      }
    }, { passive: false });

    cv.addEventListener('touchmove', function(e){
      if (e.touches.length === 2) {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        singlePanActive = false;
        e.preventDefault();
        var t0 = e.touches[0], t1 = e.touches[1];
        var d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
        var r = cv.getBoundingClientRect();
        var cx = (t0.clientX + t1.clientX)/2 - r.left;
        var cy = (t0.clientY + t1.clientY)/2 - r.top;
        if (mode === null) {
          var distDelta = Math.abs(d - lastDist);
          var panDelta = Math.hypot(t0.clientX - lastTX1, t0.clientY - lastTY1);
          mode = distDelta > panDelta && distDelta > 4 ? 'zoom' : 'pan';
        }
        if (mode === 'zoom' && lastDist > 0) {
          var factor = d / lastDist;
          zoomMap(factor, lastCX, lastCY);
        } else if (mode === 'pan') {
          var dx = cx - lastCX, dy = cy - lastCY;
          mapPanX += dx; mapPanY += dy;
          applyMapTransform();
        }
        lastDist = d; lastCX = cx; lastCY = cy;
        lastTX1 = t0.clientX; lastTY1 = t0.clientY;
      } else if (e.touches.length === 1) {
        var t = e.touches[0];
        if (singlePanActive) {
          e.preventDefault();
          var dx = t.clientX - singleLastX;
          var dy = t.clientY - singleLastY;
          if (dx !== 0 || dy !== 0) {
            mapPanX += dx; mapPanY += dy;
            applyMapTransform();
          }
          singleLastX = t.clientX;
          singleLastY = t.clientY;
        } else if (longPressTimer) {
          var moved = Math.hypot(t.clientX - longPressStartX, t.clientY - longPressStartY);
          if (moved > LONG_PRESS_MOVE_PX) {
            longPressMoved = true;
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
        }
      }
    }, { passive: false });

    cv.addEventListener('touchend', function(e){
      if (!e.touches || e.touches.length === 0) {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        if (singlePanActive) { mapPanSuppressClick = true; }
        singlePanActive = false;
        longPressMoved = false;
        mode = null; lastDist = 0;
      }
    });

    var mouseDown = false, mouseMovedFar = false;
    var mouseDownX = 0, mouseDownY = 0;
    var mouseLastX = 0, mouseLastY = 0;
    var mouseTimer = null;

    cv.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      mouseDown = true;
      mouseMovedFar = false;
      mouseDownX = e.clientX;
      mouseDownY = e.clientY;
      mouseLastX = e.clientX;
      mouseLastY = e.clientY;
      if (mouseTimer) { clearTimeout(mouseTimer); }
      mouseTimer = setTimeout(function(){
        if (mouseDown && !mouseMovedFar) {
          singlePanActive = true;
          if (navigator.vibrate) { navigator.vibrate(15); }
        }
      }, LONG_PRESS_MS);
    });

    cv.addEventListener('mousemove', function(e){
      if (!mouseDown) return;
      if (singlePanActive) {
        var dx = e.clientX - mouseLastX;
        var dy = e.clientY - mouseLastY;
        if (dx !== 0 || dy !== 0) {
          mapPanX += dx; mapPanY += dy;
          applyMapTransform();
        }
        mouseLastX = e.clientX;
        mouseLastY = e.clientY;
      } else if (mouseTimer) {
        var moved = Math.hypot(e.clientX - mouseDownX, e.clientY - mouseDownY);
        if (moved > LONG_PRESS_MOVE_PX) {
          mouseMovedFar = true;
          clearTimeout(mouseTimer);
          mouseTimer = null;
        }
      }
    });

    cv.addEventListener('mouseup', function(){
      mouseDown = false;
      if (mouseTimer) { clearTimeout(mouseTimer); mouseTimer = null; }
      if (singlePanActive) { mapPanSuppressClick = true; }
      singlePanActive = false;
    });

    cv.addEventListener('mouseleave', function(){
      if (mouseDown) {
        mouseDown = false;
        if (mouseTimer) { clearTimeout(mouseTimer); mouseTimer = null; }
        if (singlePanActive) { mapPanSuppressClick = true; }
        singlePanActive = false;
      }
    });
  }
  applyMapTransform();
}

function saveNode(){
  var name = ($('#n-name').value||'').trim();

  var status = Number($('#n-status').value)||0, desc = ($('#n-desc').value||'').trim(), note = ($('#n-goal').value||'').trim();
  var dirId = ($('#n-dir') ? $('#n-dir').value : '') || modalCtx.newDirId || 'work';
  var parentId = ($('#n-parent') ? $('#n-parent').value : '') || '';
  var selectedGoals = $$('.ltk-node:checked').map(function(c){ return c.getAttribute('data-id'); });
  var id = modalCtx.nodeId;
  if(id){
    var n = nodeOf(id);
    if(n){
      n.name=name; n.desc=desc; n.status=status; n.goal=note; n.dirId=dirId; n.parent=parentId; n.updatedAt=todayStr();
      setNodeTasks(id, selectedGoals);

      if(modalCtx.newDirId && modalCtx.newDirId !== dirId){
        S.settings.mapView.node = null;
        S.settings.mapView.focus = 'dir:'+dirId;
      }

    var nn = { id:uid(), dirId:dirId, parent:parentId, name:name, desc:desc, status:status, goal:note, createdAt:todayStr(), updatedAt:todayStr(), taskIds:[] };

    S.settings.mapView.focus = parentId ? ('node:'+parentId) : ('dir:'+dirId);

function delNode(id){

      childrenOf(id).forEach(function(c){ c.parent = n.parent || ''; });

function todayRhythm(){
  var T = todayStr();
  var wkSt = currentWeekStatus();
  var dow = (parseD(T).getDay() + 6) % 7;  // 0=周一
  var sched = RHYTHM_SCHEDULE[wkSt] || RHYTHM_SCHEDULE.normal;
  var byFit = function(fit){
    if(!fit || fit === 'sleep') return [];
    var list = S.goals.filter(function(g){ return (g.fitTimes||[]).indexOf(fit)>=0 && !computeGoal(g).complete; });
    if (wkSt === 'busy') {
      list = list.filter(function(g){ return (g.dirId||'') !== 'cog'; });
    } else if (wkSt === 'light') {
      list.sort(function(a,b){
        var ga = (a.dirId==='cog'?2:(a.dirId==='work'?1:0));
        var gb = (b.dirId==='cog'?2:(b.dirId==='work'?1:0));
        return gb - ga;
      });
    }
    return list;
  };
  var timeKeys = Object.keys(sched);
  var cs = currentSlot();
  var html = '<div class="sec"><div class="sec-title">'+ic('clock',15)+'今日节奏 <small class="tiny muted">· 周'+WD_NAME[dow]+' · '+WEEK_STATUS[wkSt].name+'建议</small><span class="line"></span></div>';
  html += '<div class="rhythm-table">';
  timeKeys.forEach(function(tk, i){
    var suggest = sched[tk][dow];
    var fit = SLOT_FIT[tk] || null;
    var tasks = fit ? byFit(fit) : [];
    var isNow = cs && cs.range === tk;
    html += '<div class="rt-row'+(i===0?' first':'')+(isNow?' now':'')+'">'+
      '<div class="rt-time">'+tk.split('–')[0]+'<span class="rt-end">'+(tk.split('–')[1]||'')+'</span></div>'+
      '<div class="rt-main">'+
        '<div class="rt-suggest">'+esc(suggest)+'</div>'+
        (tasks.length?tasks.slice(0,2).map(function(g){ var c=computeGoal(g); return '<div class="stask rt-task">'+
          '<span class="dot" style="background:'+g.color+'"></span>'+
          '<span class="st">'+esc(g.name)+(g.estMin?' <small>· 约 '+g.estMin+' 分</small>':'')+'</span>'+
          '<span class="est">'+(c.isWeekly?((c.weekDone>=c.weeklyPer?'本周已达标':'本周还差 '+n1(c.suggest))):('今日 '+n1(c.suggest)+' '+esc(g.unit)))+'</span>'+
          '<button class="btn sm pri" data-act="goto-punch" data-id="'+g.id+'">'+ic('check',14)+'</button>'+
        '</div>'; }).join(''):'<div class="tiny muted rt-empty">（按今天节奏自由安排即可）</div>')+
      '</div></div>';
  });
  html += '</div></div>';
  return html;
}

document.addEventListener('click', function(e){
  if(mapPanSuppressClick){
    mapPanSuppressClick = false;
    var onMapItem = e.target && e.target.closest && e.target.closest('.map-item, .map-zoom-ctrl, .map-back-btn');
    if(!onMapItem) return;
  }
  if(!e.target || !e.target.closest) return;
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var act = t.getAttribute('data-act');
  var id = t.getAttribute('data-id');

  switch(act){
    case 'tab': setTab(t.getAttribute('data-k')); break;
    case 'close-modal': closeModal(); break;
    case 'confirm-ok': if(modalCtx.onOk) modalCtx.onOk(); else closeModal(); break;
    case 'mit-done': {
      var mday = t.getAttribute('data-d') || curReviewDay(), mi = +t.getAttribute('data-i');
      var mit = dayState(mday);
      if(mit.mit[mi]){ mit.mit[mi].done = !mit.mit[mi].done; save(); refreshDailyView(); }
      break;
    }
    case 'mit-clear': {
      var mcday = t.getAttribute('data-d') || curReviewDay(), mj = +t.getAttribute('data-i');
      var mc = dayState(mcday);
      if(mc.mit[mj]){ mc.mit[mj].text = ''; mc.mit[mj].done = false; save(); refreshDailyView(); }
      break;
    }
    case 'rc-done': {
      var rcd = t.getAttribute('data-d');
      var rcdd = dayState(rcd);
      rcdd.done = !rcdd.done;
      save(); rerenderReview(true);
      toast(rcdd.done ? '已记录 '+md(rcd)+' 的回顾 ✓' : '已撤销回顾标记');
      break;
    }
    /* 旧 daily-edit 模式的遗留分支（rv-day/rv-done/rv-strip/go-today-review）已随内联卡片 redesign 移除 */
    case 'toggle-goal': {
      // 手风琴单开：展开一个时收起其他同级，再次点击当前已展开的则收起
      var _exp = S.settings.expanded || {};
      var _wasOpen = !!_exp[id];
      S.settings.expanded = {};            // 清空所有，实现「同级只展开一个」
      if(!_wasOpen) S.settings.expanded[id] = true;
      save(); renderToday();
      break;
    }
    case 'quick-punch': { doPunch(id); break; }
    case 'toggle-alerts': {
      S.settings.alertOpen = !S.settings.alertOpen;
      save(); renderToday();
      break;
    }
    case 'open-alert-sheet': {
      var _list = allComputed();
      var _al = alertCards(_list);
      closeModal();
      openSheet('全部提醒（'+_al.length+' 条）',
        '<div class="alert-sheet-list">'+_al.map(function(a){ return a.html; }).join('')+'</div>',
        '', {});
      break;
    }

    case 'new-goal': openGoalModal(null); break;
    case 'new-book-goal': openGoalModal(null, null, { useBooks: true }); break;
    case 'add-intel': ensureIntel(); break;
    case 'add-fruit': ensureFruit(); break;
    case 'edit-goal': {
      var g = S.goals.filter(function(x){ return x.id===id; })[0];
      if(g) openGoalModal(g);
      break;
    }
    case 'pick-color': {
      $$('#f-colors .sw').forEach(function(s){ s.classList.remove('on'); });
      t.classList.add('on');
      $('#f-color').value = t.getAttribute('data-c');
      saveDraft();
      break;
    }
    case 'save-goal': saveGoal(); break;
    case 'del-goal': {
      var gg = S.goals.filter(function(x){ return x.id===id; })[0];
      if(!gg) break;
      var cnt = recsOf(id).length;
      confirmSheet('删除这个目标？',
        '<div style="font-size:14px;line-height:1.7">『<b>'+esc(gg.name)+'</b>』以及它的 <b>'+cnt+'</b> 条打卡记录都会被删掉，<b>无法撤销</b>。</div>'+
        '<div class="tiny muted" style="margin-top:10px">如果只是目标定得不合适，其实可以直接「编辑」改总量或截止日，记录能留着。</div>',
        '确认删除', function(){
          S.goals = S.goals.filter(function(x){ return x.id!==id; });
          S.records = S.records.filter(function(r){ return r.goalId!==id; });
          S.nodes.forEach(function(n){ if(n.taskIds) n.taskIds = n.taskIds.filter(function(x){ return x!==id; }); });
          if(S.settings.punch) delete S.settings.punch[id];
          save(); closeModal(); renderAll(); toast('已删除');
        }, true);
      break;
    }
    case 'del-rec': {

/* 输入即时保存 */
function saveDraft(){
  if(!$('#f-name')) return;
  if(modalCtx.editing) return; // 编辑态不写草稿，避免污染
  S.settings.drafts = S.settings.drafts || {};
  S.settings.drafts.newGoal = readGoalForm();
  save();
}
document.addEventListener('input', function(e){
  if(!e.target || !e.target.closest) return;
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var act = t.getAttribute('data-act');
  if(act === 'gf'){ saveDraft(); return; }
  if(act === 'punch-input'){
    var gid = t.getAttribute('data-id'), f = t.getAttribute('data-f');
    if(f === 'bookId' && t.value === '__new__') return;   /* 新建书由 change 事件弹出，不暂存 __new__ */
    S.settings.punch = S.settings.punch || {};
    S.settings.punch[gid] = S.settings.punch[gid] || {};
    S.settings.punch[gid][f] = t.value;
    save();
    return;
  }
  if(act === 'note'){
    var wk = t.getAttribute('data-w'), k = t.getAttribute('data-k');
    S.weekly[wk] = S.weekly[wk] || { keep:'', issue:'', try:'', plan:'' };
    S.weekly[wk][k] = t.value;
    save();
    return;
  }
  if(act === 'mit-text'){
    var mdt = t.getAttribute('data-d') || curReviewDay(), mm = dayState(mdt), mi = +t.getAttribute('data-i');
    if(mm.mit[mi]){ mm.mit[mi].text = t.value; save(); }
    return;
  }
  if(act === 'daily-goods'){ dayState(t.getAttribute('data-d') || curReviewDay()).goods = t.value; save(); return; }
  if(act === 'daily-tomorrow'){ dayState(t.getAttribute('data-d') || curReviewDay()).tomorrow = t.value; save(); return; }
});
document.addEventListener('change', function(e){
  if(!e.target) return;
  if(e.target.closest){
    var t0 = e.target.closest('[data-act]');
    if(t0){
      var act0 = t0.getAttribute('data-act');
      if(act0 === 'rv-date'){
        var v = t0.value;
        if(v && /^\d{4}-\d{2}-\d{2}$/.test(v)){ if(diffDays(v, todayStr()) > 0) v = todayStr(); REVIEW_DAY = v; save(); renderToday(); }
        return;
      }
    }
  }
  if(e.target.id === 'n-dir'){
    var newDir = e.target.value;
    var parSel = $('#n-parent');
    if(parSel && modalCtx && modalCtx.nodeId){
      parSel.innerHTML = parentOpts(modalCtx.nodeId, newDir, '');
    }
    return;
  }
  if(e.target.classList && (e.target.classList.contains('ltk') || e.target.classList.contains('ltk-node'))){
    var lrow = e.target.closest ? e.target.closest('.lk') : null;
    if(lrow) lrow.classList.toggle('on', !!e.target.checked);
    return;
  }
  if(!e.target.closest) return;
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var ia = t.getAttribute('data-act');
  if(ia === 'punch-input'){
    var gid = t.getAttribute('data-id'), f = t.getAttribute('data-f');
    if(f === 'bookId' && t.value === '__new__'){ openNewBookSheet(gid); return; }   /* 选「新建书」→ 弹表单 */
    S.settings.punch = S.settings.punch || {};
    S.settings.punch[gid] = S.settings.punch[gid] || {};
    S.settings.punch[gid][f] = t.value;
    save();
    return;
  }
  if(ia === 'intel-backdate'){ if(modalCtx.intel){ modalCtx.intel.backDate = t.value; } return; }
  if(ia === 'goal-dir'){
    saveDraft();
    return;
  }
});

  if(e.key === 'Enter' && e.target && e.target.getAttribute && e.target.getAttribute('data-act') === 'punch-input' && e.target.getAttribute('data-f') === 'amount' && e.target.tagName === 'INPUT'){

$('#fileIn').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){ handleImport(String(fr.result)); };
  fr.onerror = function(){ toast('文件读取失败'); };
  fr.readAsText(f);
  e.target.value = '';
});
function copyText(txt){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已复制到剪贴板'); }
    catch(err){ toast('复制失败，请手动全选复制'); }
    ta.remove();
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制到剪贴板'); }, fallback);
  }else fallback();
}

  var t = todayStr();
  if(t !== lastDay){ lastDay = t; renderAll(); toast('新的一天，进度已重新计算'); }
}, 60000);

/* ---------- URL Hash 通用链接：Gist ID 跨设备预填 ---------- */
function applyHashSync(){
  if(typeof location === 'undefined' || !location.hash) return;
  var hash = location.hash;
  if(!hash || hash.indexOf('s=')<0) return;
  var m = hash.match(/s=([^&]+)/);
  if(!m) return;
  try{
    var json = decodeURIComponent(escape(atob(m[1])));
    var cfg = JSON.parse(json);
    if(cfg){
      if(cfg.g) syncState.gistId = cfg.g;
      if(cfg.u) syncState.user = cfg.u;
      if(!syncState.token){
        toast('已预填 Gist 信息，请在设置中粘贴 Token 以启用同步');
      } else {
        syncState.status = 'ok';
        syncState.error = '';
        setTimeout(function(){ syncPull({ force: true }); }, 500);
      }
      saveSyncState();
      updateSyncUI();
    }
  }catch(e){
    console.warn('Hash sync decode failed', e);
  }
  if(typeof history !== 'undefined' && history.replaceState){
    history.replaceState(null, '', location.pathname + location.search);
  }
}
function generateUniversalLink(){
  if(!syncState.gistId) return '';
  if(typeof location === 'undefined') return '';
  var cfg = { g: syncState.gistId || '', u: syncState.user || '' };
  var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
  return location.origin + location.pathname + '#s=' + encoded;
}

/* ---------------------------- 17. 启动 ---------------------------- */
S = load();
migrateTasks();
syncIntelItems();
if(!S.settings) S.settings = blank().settings;
if(!S.settings.punch) S.settings.punch = {};
if(!S.settings.drafts) S.settings.drafts = {};
if(!S.settings.statusByDate) S.settings.statusByDate = {};
if(!S.settings.mapView || !S.settings.mapView.focus) S.settings.mapView = Object.assign(blank().settings.mapView, S.settings.mapView);
if(!S.nodes) S.nodes = [];
if(!S.settings.tab) S.settings.tab = 'today';
S.settings.week = weekStartOf(todayStr());
save();
renderAll();
/* 拉取外部情报清单（失败自动回退内置） */
loadIntel();
/* 先应用通用链接配置（如有），再启动自动同步 */
applyHashSync();
/* 启动云端同步（已配置 Token 时自动拉取并周期同步） */
if (typeof syncAuto === 'function') {
  try { setTimeout(syncAuto, 1500); } catch(e){}
}
